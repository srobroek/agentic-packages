name: Check artifacts

# PR-only drift check. Regenerates the non-destructive artifacts and fails if
# the committed copies are stale, so a PR that changes a package or the
# marketplace block must include the regenerated output. Does NOT commit
# anything -- artifact regeneration + commit happens in release-please.yml on
# release. The marketplace manifests, README inventory tables, and
# release-please config are all generated; everything else is hand-authored.

# Always runs (no path filter) so `check-artifacts` can be a stable REQUIRED
# status check on main -- a path-filtered required check that never starts
# blocks every unrelated PR forever. The regen + staleness diff is a fast no-op
# when nothing artifact-affecting changed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up APM
        # jinja2 is required by the doc render system (.apm/scripts/render-docs.py);
        # PyYAML comes transitively from apm-cli.
        run: pip install "apm-cli==0.26.0" jinja2

      - name: Validate hook JSON
        run: |
          find packages .apm -path '*/hooks/*.json' -print0 |
            xargs -0 -I{} sh -c 'python3 -m json.tool "{}" > /dev/null || { echo "::error::Invalid JSON: {}"; exit 1; }'
          echo "All hook JSON files are valid."

      - name: Repo-local hook guards (.apm/hooks)
        # The repo-local PreToolUse guards under .apm/hooks are not packages, so
        # neither test.yml (scans packages/*) nor the generators above cover
        # them. Run their bats suites here so a guard regression (e.g. blocking a
        # read-only command) can't land silently, and shellcheck the specific
        # guards those suites cover. (Whole-dir shellcheck is intentionally NOT
        # run: the other repo-local scripts carry pre-existing warnings and are
        # out of scope for this gate; broaden coverage as suites are added.)
        run: |
          shellcheck -S warning .apm/hooks/scripts/agentic-source-guard.sh
          echo "shellcheck clean: agentic-source-guard.sh"
          bats_files=$(find .apm/hooks/tests -name '*.bats' 2>/dev/null || true)
          if [ -n "$bats_files" ]; then
            if ! command -v bats >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq bats
            fi
            echo "$bats_files" | xargs -r bats
          else
            echo "no bats suites in .apm/hooks/tests"
          fi

      - name: Generator unit tests (.apm/scripts)
        # The doc generators are not covered by the per-package test.yml matrix
        # (it scans packages/* only). Run their unit tests here, where Python +
        # PyYAML are already provisioned, so behavior like external marketplace
        # sources is regression-pinned independently of the staleness diff below.
        run: |
          gen_tests=$(find .apm/scripts -name 'test_*.py' 2>/dev/null || true)
          if [ -n "$gen_tests" ]; then
            pip install pytest
            echo "$gen_tests" | xargs -r python3 -m pytest -q
          else
            echo "no generator tests in .apm/scripts"
          fi

      - name: Validate released version baselines
        run: python3 .apm/scripts/check-release-baselines.py

      - name: Regenerate non-destructive artifacts
        run: |
          # Native plugin layout FIRST: each package's committed Claude and Codex
          # manifests plus target-specific skills/agents/MCP/hooks components. Then
          # the canonical render pass (marketplace block,
          # release-please config, README/docs tables) from the shared inventory.
          # The marketplace script packs both catalogs and removes packages that
          # do not target Codex from the Codex catalog.
          python3 .apm/scripts/build-native-plugins.py
          python3 .apm/scripts/render-docs.py all
          apm run build-marketplace

      - name: Audit Codex package configuration
        run: python3 .apm/scripts/audit-codex-config.py

      - name: Fail if artifacts are stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated artifacts are out of date. Run 'apm run build-artifacts' locally and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "Generated artifacts are up to date."
