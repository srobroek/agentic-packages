name: Tests

# Per-package test runner. On a PR, detects which packages/* changed and runs
# ONLY those packages' test suites:
#   - shell:  <package>/tests/*.bats      (bats)
#   - python: test_*.py next to the script (pytest, via uv)
# Cross-package generated-artifact validation lives in build-artifacts.yml and
# stays whole-repo; this job is scoped so the suite stays fast as it grows.

# Always runs (no path filter) so the `tests-gate` aggregator can be a stable
# REQUIRED status check on main: a path-filtered workflow that never starts
# leaves a required check pending forever. The matrix legs have dynamic names
# (test (packages/<x>)) and cannot be named as required checks individually, so
# `tests-gate` rolls them up into one fixed-name result.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed packages that have tests
        id: detect
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Top-level package dirs touched by this PR.
          changed_pkgs=$(git diff --name-only "$base" "$head" -- 'packages/*/**' \
            | sed -E 's#^(packages/[^/]+)/.*#\1#' | sort -u)
          # Keep only those that actually ship a test suite (bats or pytest).
          have_tests=""
          # shellcheck disable=SC2086
          for p in $changed_pkgs; do
            if find "$p" \( -name '*.bats' -o -name 'test_*.py' -o -name '_test_*.py' \) | grep -q .; then
              have_tests="$have_tests $p"
            fi
          done
          have_tests=$(echo "$have_tests" | tr ' ' '\n' | sed '/^$/d' | jq -R . | jq -cs .)
          echo "packages=$have_tests" >> "$GITHUB_OUTPUT"
          if [ "$have_tests" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed packages with tests: $have_tests"

  # Lint changed agent-facing markdown (agents, skills, steering) with the
  # write-agentic linter so fleet-contract regressions (hedges, oversized
  # descriptions, missing output contracts) can't land silently.
  agentic-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint changed agentic markdown
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Agent/skill/steering markdown under any package's .apm tree.
          # Templates are placeholder-full meta-documents; the linter exempts
          # them by path, but skip them here too to keep output clean.
          changed_md=$(git diff --name-only "$base" "$head" -- 'packages/*/.apm/**/*.md' \
            | grep -Ev '/references/template-' || true)
          if [ -z "$changed_md" ]; then
            echo "no changed agentic markdown"
            exit 0
          fi
          rc=0
          for f in $changed_md; do
            [ -f "$f" ] || continue  # deleted in this PR
            python3 packages/write-agentic/.apm/skills/write-agentic/scripts/lint.py "$f" || rc=1
          done
          exit $rc

  test:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changed.outputs.packages) }}
    # PKG avoids ${{ matrix.package }} in run: scripts, which zizmor flags as
    # template-injection (the package path comes from the PR author).
    env:
      PKG: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Set up uv (for pytest)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: shellcheck (changed package scripts, bash 3.2 / BSD floor)
        run: |
          # Lint the package's own scripts at the same severity the suite targets.
          sh_files=$(find "$PKG" -name '*.sh' 2>/dev/null || true)
          if [ -n "$sh_files" ]; then
            # preinstalled on ubuntu-latest runners
            echo "$sh_files" | xargs -r shellcheck -S warning
            echo "shellcheck clean: $PKG"
          else
            echo "no .sh in $PKG"
          fi

      - name: Run bats suites
        run: |
          bats_files=$(find "$PKG" -name '*.bats' 2>/dev/null || true)
          if [ -n "$bats_files" ]; then
            echo "$bats_files" | xargs -r bats
          else
            echo "no .bats in $PKG"
          fi

      - name: Run pytest suites
        run: |
          py_files=$(find "$PKG" -name 'test_*.py' 2>/dev/null || true)
          if [ -n "$py_files" ]; then
            echo "$py_files" | xargs -r uv run --with pytest --with pyyaml pytest -q
          else
            echo "no pytest files in $PKG"
          fi

      - name: Run standalone _test_*.py harnesses
        run: |
          # Scripts named _test_*.py are __main__-style assertion harnesses, not
          # pytest modules -- pytest's default discovery (test_*.py) skips the
          # leading underscore, so run them directly. (e.g. speckit-dag-hooks'
          # _test_dispatcher.py, which validates the dispatcher against nodes.json.)
          harnesses=$(find "$PKG" -name '_test_*.py' 2>/dev/null || true)
          if [ -n "$harnesses" ]; then
            for h in $harnesses; do
              echo "harness: $h"
              ( cd "$(dirname "$h")" && uv run --with pyyaml "$(basename "$h")" )
            done
          else
            echo "no _test_*.py harnesses in $PKG"
          fi

      - name: Generated-artifact drift gate (build_nodes.py --check)
        run: |
          # Any package that ships an authoring builder for a committed compiled
          # artifact must keep that artifact in sync. build_nodes.py --check
          # regenerates to a buffer and exits 1 on drift, so a PR that edits the
          # builder (or hand-edits the committed JSON) without regenerating fails
          # here. No-op for packages without a builder.
          builders=$(find "$PKG" -name 'build_nodes.py' 2>/dev/null || true)
          if [ -n "$builders" ]; then
            for b in $builders; do
              echo "drift check: $b"
              python3 "$b" --check
            done
          else
            echo "no build_nodes.py in $PKG"
          fi

  # Stable, always-running aggregator -- this is the REQUIRED check on main.
  # Passes when the matrix succeeded OR was legitimately skipped (no changed
  # package ships tests); fails only if a real test leg failed or was cancelled.
  tests-gate:
    needs: [changed, test, agentic-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Evaluate test matrix result
        # env: pulls needs context out of run: scripts so zizmor does not flag
        # the result values as template-injection (they are GitHub-internal, but
        # zizmor cannot verify that without an API token).
        env:
          CHANGED_RESULT: ${{ needs.changed.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.agentic-lint.result }}
        run: |
          echo "changed=$CHANGED_RESULT test=$TEST_RESULT agentic-lint=$LINT_RESULT"
          if [ "$LINT_RESULT" != "success" ]; then
            echo "::error::agentic-lint did not succeed ($LINT_RESULT)"; exit 1
          fi
          if [ "$CHANGED_RESULT" != "success" ]; then
            echo "::error::change-detection job did not succeed ($CHANGED_RESULT)"; exit 1
          fi
          case "$TEST_RESULT" in
            success|skipped) echo "Tests gate OK ($TEST_RESULT)";;
            *) echo "::error::test matrix result: $TEST_RESULT"; exit 1;;
          esac
