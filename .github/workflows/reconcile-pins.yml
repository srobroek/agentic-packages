name: Reconcile internal pins

# When a package release tag lands, parents that depend on it via a version
# range can be left pointing at a stale (or unsatisfiable) range -- pre-1.0
# caret pins in particular are minor-locked and never pick up 1.x tags. This
# workflow recomputes EVERY first-party locator range in packages/*/apm.yml
# against the authoritative released versions in .release-please-manifest.json
# and maintains a single rolling PR with the bumps.
#
# Design notes:
#   - One workflow for ALL packages, triggered by any release tag. Merging a
#     release PR pushes many tags at once; per-tag incremental updates would
#     race each other on the bump branch. A full reconcile is idempotent, so
#     concurrent tag pushes queue up (concurrency group below) and converge:
#     the second run finds no further drift and exits.
#   - Range policy: floor = the released version from the manifest, ceiling =
#     the next major ('>=1.1.0 <2.0.0'). Majors therefore flow into the bump
#     PR too -- the PR review is the gate, not the range. House style is
#     bounded '>=x <y' (pre-1.0 caret is a known trap here).
#   - Locators pinned to '#main' are deliberately floating and left alone;
#     only refs that already look like a version range (#^x.y.z, #>=...,
#     #x.y.z) are managed.
#   - Severity-matched bumps: each parent is bumped to match the HIGHEST
#     severity among the dependency changes it receives. Per changed pin we
#     compare the old pinned floor against the newly released version --
#     different major = major, different minor = minor, else patch -- and take
#     the max across all of a parent's changed pins. The reconcile then emits
#     ONE commit per severity level, each touching only that group's files:
#       patch -> 'fix(deps): ...'      (release-please: patch bump)
#       minor -> 'feat(deps): ...'     (release-please: minor bump)
#       major -> 'feat(deps)!: ...'    (release-please: major bump)
#     release-please attributes each commit's conventional type to every path
#     it touches, so a bundle whose biggest dep change was a minor gets a minor
#     release, a major gets a major, etc. That released parent re-triggers this
#     workflow, propagating the SAME severity up through nested bundles
#     (leaf -> bundle -> umbrella), one release cycle per level. (Pre-1.0
#     parents follow release-please's own 0.x mapping for these types.)
#   - Because the bump type must differ per parent, the PR is REBASE-merged,
#     not squashed: squashing would collapse the per-severity commits into a
#     single type and flatten every parent to one bump. See the auto-merge step.
#   - The PR is authored with a GitHub App token (RELEASE_APP_CLIENT_ID +
#     RELEASE_APP_PRIVATE_KEY) for the same reason release-please.yml uses it:
#     GITHUB_TOKEN-authored commits do not trigger the required PR checks, and
#     the PR would sit blocked forever.

on:
  push:
    tags:
      - "*--v*"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reconcile-internal-pins
  cancel-in-progress: false

env:
  BUMP_BRANCH: bot/reconcile-internal-pins

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Mint release-app token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e  # v2.0.6
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Reconcile locator ranges against released versions
        id: reconcile
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, pathlib, re, sys

          manifest = json.loads(pathlib.Path(".release-please-manifest.json").read_text())
          released = {
              path.removeprefix("packages/"): version
              for path, version in manifest.items()
              if path.startswith("packages/")
          }

          # '- srobroek/agentic-packages/packages/<name>#<ref>' apm.yml lines.
          # Only version-shaped refs are managed; '#main' stays floating.
          LOCATOR = re.compile(
              r"^(?P<head>\s*-\s+srobroek/agentic-packages/packages/"
              r"(?P<name>[a-z0-9-]+))#(?P<ref>[\^>=<~ 0-9.]+)\s*$"
          )

          _SEMVER = re.compile(r"(\d+)\.(\d+)\.(\d+)")

          def floor_of(ref):
              """First semver in a managed ref is its floor (>=X, ^X, ~X, X)."""
              mm = _SEMVER.search(ref)
              return tuple(int(g) for g in mm.groups()) if mm else None

          def severity(old_ref, new_version):
              """patch|minor|major for moving old_ref's floor -> new_version."""
              new = floor_of(new_version)
              old = floor_of(old_ref)
              if old is None or new is None:
                  # Can't compare (e.g. a bare '#main' shouldn't reach here) --
                  # treat as patch, the safest non-zero bump.
                  return "patch"
              if new[0] != old[0]:
                  return "major"
              if new[1] != old[1]:
                  return "minor"
              return "patch"

          _RANK = {"patch": 0, "minor": 1, "major": 2}

          changed, skipped = [], []
          # parent apm.yml path -> highest severity of its changed pins
          parent_severity = {}
          for manifest_path in sorted(pathlib.Path("packages").glob("*/apm.yml")):
              lines = manifest_path.read_text().splitlines(keepends=True)
              dirty = False
              for i, line in enumerate(lines):
                  m = LOCATOR.match(line.rstrip("\n"))
                  if not m:
                      continue
                  name, ref = m.group("name"), m.group("ref").strip()
                  version = released.get(name)
                  if version is None:
                      skipped.append(f"{manifest_path}: {name} not in release manifest")
                      continue
                  major = version.split(".")[0]
                  new_ref = f">={version} <{int(major) + 1}.0.0"
                  if ref == new_ref:
                      continue
                  sev = severity(ref, version)
                  key = str(manifest_path)
                  if _RANK[sev] > _RANK.get(parent_severity.get(key, "patch"), -1) \
                          or key not in parent_severity:
                      parent_severity[key] = sev
                  lines[i] = f"{m.group('head')}#{new_ref}\n"
                  dirty = True
                  changed.append(f"{manifest_path}: {name} '{ref}' -> '{new_ref}' [{sev}]")
              if dirty:
                  manifest_path.write_text("".join(lines))

          # Emit the per-severity file groups for the commit step to consume.
          groups = {"patch": [], "minor": [], "major": []}
          for path, sev in parent_severity.items():
              groups[sev].append(path)
          pathlib.Path(".reconcile-groups.json").write_text(json.dumps(groups))

          for entry in skipped:
              print(f"::warning::skipped {entry}")
          print("\n".join(changed) or "all pins already in sync")
          EOF

          # Exclude the scratch groups file from the "did anything change" test.
          if git diff --quiet -- 'packages/*/apm.yml'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm -f .reconcile-groups.json
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- 'packages/*/apm.yml'
          fi

      - name: Push bump branch and open PR
        if: steps.reconcile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # If the rolling branch already carries exactly this diff, don't
          # force-push an identical tree -- it would only churn the PR checks.
          if git fetch origin "$BUMP_BRANCH" 2>/dev/null; then
            if git diff --quiet "origin/$BUMP_BRANCH" -- 'packages/*/apm.yml'; then
              echo "Bump branch already up to date."
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BUMP_BRANCH"

          # One commit per severity level, each staging only that group's files,
          # with the conventional type release-please maps to that bump:
          #   patch -> fix(deps):     minor -> feat(deps):     major -> feat(deps)!:
          # Rebase-merging the PR (see auto-merge step) preserves these distinct
          # types so each parent is released at its own severity.
          commit_group() {
            local sev="$1" type="$2" subject="$3"
            local files
            files=$(python3 -c "import json;print('\n'.join(json.load(open('.reconcile-groups.json'))['$sev']))")
            [ -z "$files" ] && return 0
            echo "$files" | tr '\n' '\0' | xargs -0 git add --
            git commit -m "$type: $subject"
          }
          commit_group patch "fix(deps)"  "sync internal package pins (patch-level dep releases)"
          commit_group minor "feat(deps)" "sync internal package pins (minor-level dep releases)"
          commit_group major "feat(deps)!" "sync internal package pins (major-level dep releases)"

          rm -f .reconcile-groups.json
          git push --force origin "$BUMP_BRANCH"

          if ! gh pr list --head "$BUMP_BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create \
              --head "$BUMP_BRANCH" \
              --title "fix(deps): sync internal package pins to released versions" \
              --body "$(printf 'Automated reconcile of first-party locator ranges in packages/*/apm.yml against .release-please-manifest.json.\n\nPolicy: floor = released version, ceiling = next major. `#main` refs are left floating.\n\nEach parent is bumped to match the HIGHEST severity of the dep changes it receives (patch/minor/major), via one commit per level (fix(deps) / feat(deps) / feat(deps)!). This PR is REBASE-merged so those per-severity types survive; the released parents re-trigger the reconcile to cascade the update up through nested bundles.')"
          fi

      - name: Auto-merge the reconcile PR once checks pass
        if: steps.reconcile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # The reconcile PR is a mechanical dep-pin bump gated only by the
          # required checks (check-artifacts + tests-gate); main requires no
          # review. Rather than wait for a human to click merge on a tiny +N/-N
          # PR, poll until the required checks are green and REBASE-merge.
          #
          # Rebase (not squash) is required: the PR carries one commit per
          # severity level (fix(deps) / feat(deps) / feat(deps)!) and squashing
          # would collapse them into a single conventional type, flattening
          # every parent to one bump. Rebase replays the distinct commits onto
          # main so release-please bumps each parent at its own severity. Rebase
          # also keeps main's required-linear-history happy.
          #
          # Native GitHub auto-merge (gh pr merge --auto) is disabled on this
          # repo, so this step drives the merge itself. The RELEASE PR that
          # release-please opens from the resulting commits is NOT touched here
          # -- that stays a manual release gate.
          #
          # main protection is strict (branch must be up to date), so if main
          # moves under us we rebase the branch onto main and let checks re-run.

          num="$(gh pr list --head "$BUMP_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$num" ]; then
            echo "No open reconcile PR to merge."
            exit 0
          fi
          echo "Reconcile PR: #$num"

          # Poll up to ~15 min (30 * 30s). Required checks are fast (<1 min
          # historically), so this almost always resolves in the first minutes.
          for attempt in $(seq 1 30); do
            state="$(gh pr view "$num" --json mergeStateStatus,state --jq '.state + "/" + .mergeStateStatus')"
            echo "attempt $attempt: $state"
            case "$state" in
              MERGED/*)
                echo "Already merged."; exit 0 ;;
              CLOSED/*)
                echo "PR was closed without merging; nothing to do."; exit 0 ;;
              OPEN/CLEAN)
                # All required checks passed and branch is up to date.
                gh pr merge "$num" --rebase --delete-branch
                echo "Merged #$num."; exit 0 ;;
              OPEN/BEHIND)
                # Strict protection: main moved. Rebase the PR branch onto main
                # (--rebase keeps the per-severity commits linear, no merge
                # commit) and re-run checks, then keep polling.
                echo "Branch behind main; rebasing onto main."
                gh pr update-branch "$num" --rebase || true ;;
              OPEN/BLOCKED|OPEN/UNKNOWN|OPEN/UNSTABLE)
                # BLOCKED covers both "required checks still pending" and
                # "a required check failed". Distinguish them: if any check
                # has a failing conclusion, bail out fast instead of polling
                # the full window; otherwise keep waiting for pending checks.
                failed="$(gh pr view "$num" --json statusCheckRollup \
                  --jq '[.statusCheckRollup[] | select((.conclusion // "") | test("FAILURE|TIMED_OUT|CANCELLED|ACTION_REQUIRED|STARTUP_FAILURE"))] | length')"
                if [ "${failed:-0}" -gt 0 ]; then
                  echo "::error::Reconcile PR #$num has $failed failing check(s); leaving it open for manual attention."
                  exit 1
                fi
                # else: checks still pending / mergeability not yet computed.
                : ;;
              OPEN/DIRTY)
                echo "::error::Reconcile PR #$num has conflicts; needs manual attention."
                exit 1 ;;
            esac
            sleep 30
          done

          echo "::warning::Reconcile PR #$num not mergeable within the poll window; leaving it open for manual merge."
