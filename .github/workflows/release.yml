name: Release

# Fires when release-please pushes a per-package tag (<name>-v<version>).
# Runs the APM release gate (version alignment + clean marketplace) and creates
# a GitHub release with the packed marketplace artifacts attached.

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Release via apm-action
        uses: microsoft/apm-action@v1
        with:
          mode: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
