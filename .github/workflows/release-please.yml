name: Release Please

# Maintains a release PR from Conventional Commits (feat/fix/...), updates
# CHANGELOG.md and the version in apm.yml, and tags a release on merge.
#
# Artifact freshness: release-please updates the authoritative version state
# (apm.yml $.version + .release-please-manifest.json) but does NOT regenerate the
# version-derived artifacts -- the `version` field in each package's generated
# .claude-plugin/plugin.json and the per-plugin versions in .claude-plugin/
# marketplace.json. Those go stale the moment a version bumps, and the required
# `check-artifacts` PR check fails on the drift. So the "Sync generated artifacts"
# step below regenerates them and amends them onto the release branch whenever a
# release PR is open. (Before the native-plugin layout existed there were no such
# artifacts, so this was a no-op; #401 was the first release that carried them and
# the first to surface the drift, once the PAT below made the PR checks actually run.)
#
# TOKEN: the release PR is authored with a GitHub App token (RELEASE_APP_CLIENT_ID +
# RELEASE_APP_PRIVATE_KEY), NOT the default GITHUB_TOKEN. GitHub deliberately does not
# trigger workflows from commits made by GITHUB_TOKEN, so the required PR checks
# (check-artifacts, tests-gate) would complete as `action_required` 0s no-ops and the
# release PR would stay permanently BLOCKED. An App-token-authored commit triggers those
# workflows normally, so the release PR self-satisfies branch protection.
# The same token pushes the artifact-sync commit so it, too, triggers the checks.
# App permissions required (this repo): Contents RW + Pull requests RW.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint release-app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Checkout with the App token persisted as the push credential, so the
      # artifact sync below pushes with a token whose commits trigger the required
      # checks. (App-authored commits trigger workflows; GITHUB_TOKEN ones don't.)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        with:
          # App token so the release PR's commits trigger the required PR checks.
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When a release PR is open, its apm.yml/manifest version bumps make the
      # generated plugin.json + marketplace.json versions stale, failing the
      # required check-artifacts gate. Regenerate them and amend onto the release
      # branch so the PR self-satisfies branch protection. No-op (no diff -> no
      # commit) when artifacts are already in sync. The push uses the PAT
      # persisted by checkout above, so it re-triggers the PR checks.
      - name: Set up Python
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          # No pip cache here: this job runs on the release path after
          # release-please-action publishes artifacts, so caching would be
          # flagged as cache-poisoning (zizmor: cache-poisoning) by the
          # workflow-lint gate. The install is a one-off on every release push.

      - name: Sync generated artifacts on the release PR
        if: ${{ steps.release.outputs.pr }}
        # NOTE: step-level `env` is evaluated even when the `if` guard is false, so
        # `fromJSON(...)` must be guarded too -- when release-please opens no PR,
        # `outputs.pr` is '' and a bare `fromJSON('')` aborts the whole job with
        # "Error reading JToken". Only parse when the output is non-empty.
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_BRANCH"
          git checkout "$RELEASE_BRANCH"

          python3 -m pip install --quiet -r .github/requirements-ci.txt
          python3 .apm/scripts/build-native-plugins.py
          python3 .apm/scripts/render-docs.py all
          apm run build-marketplace

          if git diff --quiet; then
            echo "Generated artifacts already in sync; nothing to amend."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync generated artifacts to released versions"
          git push origin "HEAD:$RELEASE_BRANCH"
