name: Release Please

# Maintains a release PR from Conventional Commits (feat/fix/...), updates
# CHANGELOG.md and the version in apm.yml, and tags a release on merge.
#
# Artifact freshness is NOT handled here. release-please updates the authoritative
# version state (apm.yml $.version + .release-please-manifest.json) directly. The
# only release-derived artifact that goes stale is the `version` field inside the
# generated marketplace.json (a catalog display value for the native-plugin path),
# and the PR check (build-artifacts.yml `check-artifacts`) regenerates + gates that
# on every subsequent PR. A post-release auto-commit can't push to main anyway --
# branch protection requires status checks that don't run on a bot's direct push --
# so it is intentionally omitted.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
