name: Release Please

# Maintains a release PR from Conventional Commits (feat/fix/...), updates
# CHANGELOG.md and the version in apm.yml, and tags a release on merge.
#
# When a release is published, regenerates the marketplace manifests and README
# inventory tables and commits them onto main so the released state is fresh.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  regenerate-artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up APM
        # jinja2 is required by the doc render system (.apm/scripts/render-docs.py);
        # PyYAML comes transitively from apm-cli.
        run: pip install apm-cli jinja2

      - name: Regenerate marketplace + README tables
        run: |
          python3 .apm/scripts/render-docs.py all
          apm pack

      - name: Commit regenerated artifacts
        run: |
          if git diff --quiet; then
            echo "No artifact drift to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apm.yml .claude-plugin/marketplace.json .agents/plugins/marketplace.json README.md
          git commit -m "chore: regenerate agentic artifacts for release [skip ci]"
          git push
