name: Release Please

# Maintains a release PR from Conventional Commits (feat/fix/...), updates
# CHANGELOG.md and the version in apm.yml, and tags a release on merge.
#
# Artifact freshness is NOT handled here. release-please updates the authoritative
# version state (apm.yml $.version + .release-please-manifest.json) directly. The
# only release-derived artifact that goes stale is the `version` field inside the
# generated marketplace.json (a catalog display value for the native-plugin path),
# and the PR check (build-artifacts.yml `check-artifacts`) regenerates + gates that
# on every subsequent PR. A post-release auto-commit can't push to main anyway --
# branch protection requires status checks that don't run on a bot's direct push --
# so it is intentionally omitted.
#
# TOKEN: the release PR is authored with RELEASE_PLEASE_PAT (a fine-grained PAT),
# NOT the default GITHUB_TOKEN. GitHub deliberately does not trigger workflows from
# commits made by GITHUB_TOKEN, so the required PR checks (check-artifacts,
# tests-gate) would complete as `action_required` 0s no-ops and the release PR would
# stay permanently BLOCKED. A PAT-authored commit triggers those workflows normally,
# so the release PR self-satisfies branch protection. If the secret is absent the
# action falls back to GITHUB_TOKEN and the deadlock returns -- keep the secret set.
# PAT scope (fine-grained, this repo only): Contents RW + Pull requests RW.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # Fine-grained PAT so the release PR's commits trigger the required PR
          # checks (a GITHUB_TOKEN-authored commit does not). Falls back to
          # GITHUB_TOKEN if the secret is unset -- see the header note.
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
