# Global (user-scope) APM manifest.
#
# WHAT THIS IS
#   This is the user-scope manifest that chezmoi deploys to ~/.apm/apm.yml.
#   Running `apm install --global --frozen --target claude,codex` against it
#   reproduces the recommended GLOBAL agentic layer (granular guard hooks +
#   bootstrap skills + chezmoi-editor) on any machine. The pins below are the
#   source of truth for what "the global layer" is.
#
# SYMLINKED-TARGETS CAVEAT
#   Global install merges generated config into ~/.claude/settings.json and
#   ~/.codex/hooks.json (et al). If chezmoi manages those paths as SYMLINKS,
#   do NOT let apm write through the symlink: seed a REAL base file at the
#   target path first (an empty/minimal {} is fine) and let apm merge on top
#   of that real file. Symlinked targets either get clobbered or cause apm to
#   edit the chezmoi source out-of-band, which desyncs the dotfile repo.
#
# REFRESHING
#   Pins are caret ranges to match the repo convention; bump the floor here to
#   move the global layer forward, then re-run `apm run install-global`. Use
#   `apm run update-global` (non-frozen) to pull the latest allowed by ranges.
#
name: global-agentic
version: 0.1.0
target: claude,codex
includes: auto

dependencies:
  apm:
    # --- granular guard hooks ---
    - srobroek/agentic-packages/packages/hooks-bash-safety#^0.2.1
    - srobroek/agentic-packages/packages/hooks-git-safety#^0.4.0
    - srobroek/agentic-packages/packages/hooks-worktree#^0.2.0
    - srobroek/agentic-packages/packages/hooks-no-ff#^0.2.0
    - srobroek/agentic-packages/packages/hooks-squash-merge#^0.2.1
    - srobroek/agentic-packages/packages/hooks-tool-prefs#^0.2.1
    - srobroek/agentic-packages/packages/hooks-branch-check#^0.2.1
    - srobroek/agentic-packages/packages/hooks-git-workflow#^0.2.0
    - srobroek/agentic-packages/packages/hooks-quality#^0.1.1
    # TODO: add hooks-chezmoi-guard once that package exists (created separately).
    # --- bootstrap skills ---
    - srobroek/agentic-packages/packages/catchup#^0.1.4
    - srobroek/agentic-packages/packages/handover#^0.1.2
    # --- dotfile management ---
    - srobroek/agentic-packages/packages/chezmoi-editor#^0.2.1
    # --- working-style steering ---
    # steering-pragmatic is the PACKAGED, versioned, cross-tool source of truth
    # for the pragmatic working-style steering, deployed globally from here. The
    # previously hand-maintained global chezmoi personality.md duplicate is to be
    # DELETED in favor of this package (single source of truth). That deletion is
    # a chezmoi-source change handled separately from this repo.
    - srobroek/agentic-packages/packages/steering-pragmatic#^0.2.0

scripts:
  install-global: "apm install --global --frozen --target claude,codex"
  update-global: "apm install --global --target claude,codex"

compilation:
  strategy: distributed
  source_attribution: false
  placement:
    min_instructions_per_file: 1
