name: my-project
version: 0.1.0
target: all
includes: auto

dependencies:
  apm:
    - git@github.com:srobroek/agentic-packages.git

scripts:
  install-agentic-tools: "apm install --target claude,codex"
  patch-agentic-tools: "python3 apm_modules/srobroek/agentic-packages/.apm/scripts/patch-runtime-agents.py --all"
  audit-agentic-tools: "python3 apm_modules/srobroek/agentic-packages/.apm/scripts/audit-agentic-assets.py"
  setup-agentic-tools: "apm run install-agentic-tools && apm compile --target codex,claude --no-constitution && apm run patch-agentic-tools && apm run audit-agentic-tools"

compilation:
  strategy: distributed
  source_attribution: false
  placement:
    min_instructions_per_file: 1
