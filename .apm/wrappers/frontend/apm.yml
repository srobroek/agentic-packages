name: frontend
version: 0.1.0
description: Frontend development bundle with Impeccable design, Playwright browser automation MCP, and Hobson frontend patterns.
author: Sjors Robroek
license: MIT
type: hybrid
target: all
includes: auto

dependencies:
  apm:
    - pbakaus/impeccable/.agents/skills/impeccable#main
    - wshobson/agents/plugins/frontend-mobile-development#main
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - '@anthropic-ai/playwright-mcp@latest'
