name: frontend
version: 0.1.0
description: Frontend development bundle with Impeccable design skills, Playwright browser automation, and frontend-mobile-development patterns.
author: Sjors Robroek
license: MIT
type: skill
target: all
includes: auto

dependencies:
  apm:
    - pbakaus/impeccable/.agents/skills/impeccable#main
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@anthropic-ai/playwright-mcp@latest"
