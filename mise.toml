[tools]
# beads CLI — orchestrate/beads packages exercise it in tests; CI installs
# the same pinned version via mise-action.
"aqua:gastownhall/beads" = "1.3.0"

# yamllint — the `yamllint` pre-commit hook is `language: system` and shells out
# to this binary, but nothing declared it, so the hook could never run locally:
# `mise ERROR No version is set for shim: yamllint`. CI installed it separately
# with `pip install "yamllint==1.37.1"` in .github/workflows/lint.yml, so the
# gate only ever ran there. Pinned to that same version.
"pipx:yamllint" = "1.37.1"
