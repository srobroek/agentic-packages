name: srobroek-agentic
version: 0.1.0
description: Shared APM packages for Codex, Claude, and compatible agent runtimes.
author: Sjors Robroek
license: MIT
type: hybrid
target: all
includes: auto
dependencies:
  apm:
  - mattpocock/skills/skills/engineering/diagnose#main
scripts:
  build-packages: "python3 .apm/scripts/build-packages.py"
  build-bundles: "python3 .apm/scripts/build-bundles.py"
  build-marketplace: "python3 .apm/scripts/build-marketplace.py"
  build-indexes: "python3 .apm/scripts/build-agentic-indexes.py"
  build-artifacts: "python3 .apm/scripts/build-packages.py && python3 .apm/scripts/build-marketplace.py && python3 .apm/scripts/build-agentic-indexes.py"
  install: "apm install --target claude,codex,agent-skills"
  prune-stale-local-packages: "python3 .apm/scripts/prune-stale-local-packages.py"
  compile: "apm compile --target codex --no-constitution"
  compile-codex: "apm compile --target codex --no-constitution"
  strip-constitution-blocks: "python3 .apm/scripts/strip-constitution-blocks.py"
  fix-agents-context-links: "python3 .apm/scripts/fix-agents-context-links.py"
  write-claude-pointers: "python3 .apm/scripts/write-claude-pointers.py"
  patch-agents: "python3 .apm/scripts/patch-runtime-agents.py --all"
  patch-codex-agents: "python3 .apm/scripts/patch-runtime-agents.py --codex"
  patch-claude-agents: "python3 .apm/scripts/patch-runtime-agents.py --claude"
  audit-agentic-assets: "python3 .apm/scripts/audit-agentic-assets.py"
  setup: "apm run install && apm run prune-stale-local-packages && apm run compile && apm run strip-constitution-blocks && apm run fix-agents-context-links && apm run write-claude-pointers && apm run patch-agents && apm run audit-agentic-assets"
compilation:
  strategy: distributed
  source_attribution: false
  exclude:
    - "packages/**"
    - ".apm/instructions/70-language-typescript.instructions.md"
    - ".apm/instructions/71-language-python.instructions.md"
    - ".apm/instructions/72-language-go.instructions.md"
    - ".apm/instructions/73-language-rust.instructions.md"
    - ".apm/instructions/74-language-terraform.instructions.md"
  placement:
    min_instructions_per_file: 1

marketplace:
  owner:
    name: srobroek
    url: https://github.com/srobroek
  build:
    tagPattern: "v{version}"
  packages:
    - name: core
      description: "Bundle: Deterministic shared project baseline with core agents, code intelligence, project lifecycle, agentic maintenance, first-party skill writing, and Matt grill/diagnose workflows. Contains: skills catchup, handover, code-review, codebase-index, codebase-memory, commit-push-merge, commit-push-pr, explore, optimize-steering, prompt-lookup, quick-commit, research, steering-audit, unstuck, verify, web-fetch, write-a-skill; agents adversarial-challenger, coder, external-repo-worker, pr-reviewer; steering; scripts write-claude-pointers, strip-constitution-blocks, prune-stale-local-packages, fix-agents-context-links, patch-runtime-agents, audit-agentic-assets; packages diagnose, grill-me, grill-with-docs, context-management, agent-orchestration."
      source: srobroek/agentic-packages
      subdir: packages/core
      ref: main
    - name: catchup
      description: "Resume interrupted project work by locating and following the best handover before doing fresh discovery. Use when starting in an existing repo/worktree, after context loss or /clear, when the user says catchup/continue/resume/handover, or when asked what changed or what is next."
      source: srobroek/agentic-packages
      subdir: .apm/skills/catchup
      ref: main
    - name: code-review
      description: "Use for review requests. Prioritizes bugs, regressions, risks, and missing tests."
      source: srobroek/agentic-packages
      subdir: .apm/skills/code-review
      ref: main
    - name: codebase-index
      description: "Use when the codebase graph is missing or stale. Rebuild the codebase-memory index first."
      source: srobroek/agentic-packages
      subdir: .apm/skills/codebase-index
      ref: main
    - name: codebase-memory
      description: "Use for graph-aware codebase exploration, tracing, and reference lookup."
      source: srobroek/agentic-packages
      subdir: .apm/skills/codebase-memory
      ref: main
    - name: commit-push-merge
      description: "Publish and merge a branch by committing local changes when needed, pushing, and merging after inferring or confirming the target and method. Use when the user asks to commit, push, and merge or to direct-merge a branch."
      source: srobroek/agentic-packages
      subdir: .apm/skills/commit-push-merge
      ref: main
    - name: commit-push-pr
      description: "Publish a branch by committing local changes when needed, pushing, and opening or updating a pull request. Use when the user explicitly asks to commit and push with a PR, open a PR, or publish the current branch for review."
      source: srobroek/agentic-packages
      subdir: .apm/skills/commit-push-pr
      ref: main
    - name: debate
      description: "Use for deep tradeoff analysis on architectural decisions, technology choices, and feature proposals. Tests an idea from both sides before recommending a path. Agents may suggest this when the user faces a non-trivial decision."
      source: srobroek/agentic-packages
      subdir: .apm/skills/debate
      ref: main
    - name: eli5
      description: "Explains a topic at multiple depth levels. Use when a topic needs layered explanation, when the user is confused about a concept, or when the user says 'explain X.' Agents may suggest this when the user seems unfamiliar with a topic or asks 'what is' / 'how does' questions."
      source: srobroek/agentic-packages
      subdir: .apm/skills/eli5
      ref: main
    - name: explore
      description: "Use for read-only codebase orientation, file discovery, and path tracing."
      source: srobroek/agentic-packages
      subdir: .apm/skills/explore
      ref: main
    - name: go-quality
      description: "Use to run Go format, lint, and test checks with the project toolchain."
      source: srobroek/agentic-packages
      subdir: .apm/skills/go-quality
      ref: main
    - name: handover
      description: "Save a self-contained recovery prompt for a later agent session in the shared handover store. Use when ending or pausing work, switching context, preserving unfinished implementation state, or when the user asks for a handover."
      source: srobroek/agentic-packages
      subdir: .apm/skills/handover
      ref: main
    - name: optimize-steering
      description: "Audit and optimize agent-facing markdown files (steering docs, skills, agent definitions) for token efficiency, structural compliance, and cross-model compatibility. Applies research-backed formatting conventions (R1-R7). Runs `steering-audit` first for drift/hook/lint detection. Use when asked to audit agent docs, optimize steering files, refactor SKILL.md, normalize agent instructions, reduce token waste, or fix agent compliance issues. To create a new skill from scratch, use `write-a-skill` instead."
      source: srobroek/agentic-packages
      subdir: .apm/skills/optimize-steering
      ref: main
    - name: playwright
      description: "Use when automating browser interactions through a Playwright MCP server."
      source: srobroek/agentic-packages
      subdir: .apm/skills/playwright
      ref: main
    - name: prompt-lookup
      description: "Use when finding, comparing, or improving prompt templates and prompt-engineering patterns."
      source: srobroek/agentic-packages
      subdir: .apm/skills/prompt-lookup
      ref: main
    - name: python-quality
      description: "Use to run Python format, lint, type-check, and test commands with the project toolchain."
      source: srobroek/agentic-packages
      subdir: .apm/skills/python-quality
      ref: main
    - name: quick-commit
      description: "Create a deliberate local git commit without pushing or opening a PR. Use when the user asks to commit local changes, make a checkpoint commit, or run a fast commit-only workflow."
      source: srobroek/agentic-packages
      subdir: .apm/skills/quick-commit
      ref: main
    - name: research
      description: "Use when the user needs open-ended research requiring synthesis across multiple sources — comparisons, technology evaluations, tradeoff analysis. NOT for single-repo 'where is X' lookups (use explore), URL-specific fetches (use web-fetch), or speckit research workflows."
      source: srobroek/agentic-packages
      subdir: .apm/skills/research
      ref: main
    - name: rust-quality
      description: "Use to run Rust format, lint, and test checks with the project toolchain."
      source: srobroek/agentic-packages
      subdir: .apm/skills/rust-quality
      ref: main
    - name: sniff
      description: "Use for a stability, hardening, and cleanup audit across a codebase."
      source: srobroek/agentic-packages
      subdir: .apm/skills/sniff
      ref: main
    - name: speckit-bugfix
      description: "Use when fixing bugs in a SpecKit repo. Scales from quick fixes to full bug workflows."
      source: srobroek/agentic-packages
      subdir: .apm/skills/speckit-bugfix
      ref: main
    - name: steering-audit
      description: "Use to audit agent rules, hooks, skills, and guardrails for drift and cleanup."
      source: srobroek/agentic-packages
      subdir: .apm/skills/steering-audit
      ref: main
    - name: typescript-quality
      description: "Use to run TypeScript or JavaScript format, lint, type-check, and test commands."
      source: srobroek/agentic-packages
      subdir: .apm/skills/typescript-quality
      ref: main
    - name: unstuck
      description: "Escalate stalled debugging by challenging assumptions after the normal diagnosis loop has failed. Use when repeated fixes, same-file re-editing, flaky evidence, circular hypotheses, or going in circles suggest the agent is stuck; bundled diagnose owns first-pass debugging."
      source: srobroek/agentic-packages
      subdir: .apm/skills/unstuck
      ref: main
    - name: verify
      description: "Run and report a final local verification pass before handoff, commit, push, merge, or PR. Use when the user asks to verify, test everything, check readiness, or prove local changes are safe to hand off."
      source: srobroek/agentic-packages
      subdir: .apm/skills/verify
      ref: main
    - name: web-fetch
