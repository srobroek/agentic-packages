    - name: write-a-skill
      description: "Create or rewrite agent skills with precise triggers, progressive disclosure, references, scripts, and source-of-truth placement. Use when the user asks to create, write, repair, optimize, or package a skill for bootstrap/global use or an APM marketplace."
      source: srobroek/agentic-packages
      subdir: .apm/skills/write-a-skill
      ref: main
    - name: agent-adversarial-challenger
      description: "Read-only adversarial debugger for the unstuck workflow. Use after normal diagnosis stalls and the parent can provide observable facts only; investigates independently, challenges assumptions behind failed fixes, and returns evidence-backed alternative causes without editing files."
      source: srobroek/agentic-packages
      subdir: .apm/agents/adversarial-challenger.agent.md
      ref: main
    - name: agent-coder
