name: srobroek-agentic
version: 1.2.0
description: Shared APM packages for Codex, Claude, and compatible agent runtimes.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
targets:
  - claude
  - codex
  - kiro
includes: auto
scripts:
  build-readme-tables: python3 .apm/scripts/build-readme-tables.py
  check-readme-tables: python3 .apm/scripts/build-readme-tables.py --check
  build-release-please: python3 .apm/scripts/build-release-please.py
  check-release-please: python3 .apm/scripts/build-release-please.py --check
  build-marketplace-block: python3 .apm/scripts/build-marketplace-block.py
  check-marketplace-block: python3 .apm/scripts/build-marketplace-block.py --check
  build-marketplace: apm pack
  render-docs: python3 .apm/scripts/render-docs.py all
  check-docs: python3 .apm/scripts/render-docs.py all --check
  build-artifacts: python3 .apm/scripts/render-docs.py all && apm pack
  install: apm install --target claude,codex
  patch-agents: python3 .apm/scripts/patch-runtime-agents.py --all
  audit-agentic-assets: python3 .apm/scripts/audit-agentic-assets.py
  setup: >-
    apm run install && apm compile --target codex,claude --no-constitution &&
    apm run patch-agents && apm run audit-agentic-assets
compilation:
  strategy: distributed
  source_attribution: true
  exclude:
    - packages/**
    - .apm/instructions/70-language-typescript.instructions.md
    - .apm/instructions/71-language-python.instructions.md
    - .apm/instructions/72-language-go.instructions.md
    - .apm/instructions/73-language-rust.instructions.md
    - .apm/instructions/74-language-terraform.instructions.md
  placement:
    min_instructions_per_file: 1
marketplace:
  owner:
    name: srobroek
    url: https://github.com/srobroek
  outputs:
    claude: {}
    codex: {}
  versioning:
    strategy: tag_pattern
  build:
    tagPattern: '{name}-v{version}'
