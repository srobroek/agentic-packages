name: srobroek-agentic
version: 0.8.0
description: Shared APM packages for Codex, Claude, and compatible agent runtimes.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
targets:
  - claude
  - codex
includes: auto
dependencies:
  apm:
    - mattpocock/skills/skills/engineering/diagnose#main
scripts:
  build-readme-tables: python3 .apm/scripts/build-readme-tables.py
  check-readme-tables: python3 .apm/scripts/build-readme-tables.py --check
  build-release-please: python3 .apm/scripts/build-release-please.py
  check-release-please: python3 .apm/scripts/build-release-please.py --check
  build-marketplace-block: python3 .apm/scripts/build-marketplace-block.py
  check-marketplace-block: python3 .apm/scripts/build-marketplace-block.py --check
  build-marketplace: apm pack
  build-artifacts: >-
    python3 .apm/scripts/build-marketplace-block.py && python3
    .apm/scripts/build-release-please.py && python3
    .apm/scripts/build-readme-tables.py && apm pack
  install: apm install --target claude,codex
  patch-agents: python3 .apm/scripts/patch-runtime-agents.py --all
  audit-agentic-assets: python3 .apm/scripts/audit-agentic-assets.py
  setup: >-
    apm run install && apm compile --target codex,claude --no-constitution &&
    apm run patch-agents && apm run audit-agentic-assets
compilation:
  strategy: distributed
  source_attribution: true
  exclude:
    - packages/**
    - .apm/instructions/70-language-typescript.instructions.md
    - .apm/instructions/71-language-python.instructions.md
    - .apm/instructions/72-language-go.instructions.md
    - .apm/instructions/73-language-rust.instructions.md
    - .apm/instructions/74-language-terraform.instructions.md
  placement:
    min_instructions_per_file: 1
marketplace:
  owner:
    name: srobroek
    url: https://github.com/srobroek
  outputs:
    claude: {}
    codex: {}
  versioning:
    strategy: tag_pattern
  build:
    tagPattern: '{name}-v{version}'
  packages:
    - name: agent-adversarial-challenger
      source: ./packages/agent-adversarial-challenger
      category: debugging
      tags:
        - agent
        - adversarial
        - critique
        - decision-review
        - debugging
      description: >-
        Read-only adversarial challenger: independently stress-tests any claim,
        plan, design, hypothesis, decision, or conclusion -- technical or not --
        by attacking its assumptions and returning evidence-backed
        counter-arguments and alternatives, without changing anything. The
        critic half of a generate/critique loop; debugging escalation, debate
        devil's-advocate, research and decision review are all applications.
      version: 0.2.0
    - name: agent-coder
      source: ./packages/agent-coder
      category: engineering
      tags:
        - agent
        - engineering
        - implementation
      description: >-
        Implementation subagent for bounded code changes, tests, and refactors
        within a defined scope.
      version: 0.1.1
    - name: agent-external-repo-worker
      source: ./packages/agent-external-repo-worker
      category: engineering
      tags:
        - agent
        - engineering
        - repos
      description: >-
        Subagent that works inside an external repository outside the caller
        project. Handles isolated clone or reuse, convention discovery, bounded
        edits, local verification, and delegated publish or PR work.
      version: 0.1.2
    - name: agent-pr-reviewer
      source: ./packages/agent-pr-reviewer
      category: quality
      tags:
        - agent
        - quality
        - review
      description: >-
        Subagent that reviews pull requests for code quality, security, and best
        practices.
      version: 0.1.1
    - name: agentic-maintenance
      source: ./packages/agentic-maintenance
      category: agentic-maintenance
      tags:
        - bundle
        - steering
      description: >-
        Maintain your agentic assets: audit and optimize steering, look up
        prompts, write new skills, with the coder and PR reviewer agents.
        Includes Hobson documentation-standards and plugin-eval for evaluating
        external packages.
      version: 0.1.3
    - name: audit-steering
      source: ./packages/audit-steering
      category: agentic-maintenance
      tags:
        - skill
        - maintenance
        - steering
      description: >-
        Audit agent rules, hooks, skills, and guardrails for drift, duplication,
        stale files, and token waste.
      version: 0.1.2
    - name: catchup
      source: ./packages/catchup
      category: project-lifecycle
      tags:
        - skill
        - lifecycle
        - resume
      description: >-
        Resume interrupted project work by locating and following the best
        handover before doing fresh discovery, after context loss, /clear, or a
        continue/resume request.
      version: 0.1.3
    - name: chezmoi-editor
      source: ./packages/chezmoi-editor
      category: dotfiles
      tags:
        - skill
        - dotfiles
        - chezmoi
      description: >-
        Edit chezmoi-managed dotfiles from their authoritative source files. Use
        when changing dotfiles, global agent/tool config, templates, private
        files, symlinked config, or any live target that may be managed by
        chezmoi.
      version: 0.2.1
    - name: code-intelligence
      source: ./packages/code-intelligence
      category: code-intelligence
      tags:
        - bundle
        - graph
      description: >-
        Codebase understanding toolkit: graph/index/search skills
        (codebase-index, codebase-memory, explore, prompt-lookup), research and
        web-fetch, the PR reviewer agent, project-structure steering, and Hobson
        documentation/architecture plugins.
      version: 0.1.3
    - name: code-review
      source: ./packages/code-review
      category: quality
      tags:
        - skill
        - quality
        - review
      description: >-
        Review a diff, change set, or PR for bugs, regressions, security risks,
        and missing tests, reporting findings by severity.
      version: 0.1.2
    - name: codebase-index
      source: ./packages/codebase-index
      category: code-intelligence
      tags:
        - skill
        - code-intelligence
        - graph
      description: >-
        Rebuild the codebase-memory graph index when it is missing or stale.
        Requires the codebase-memory-mcp binary; without it, fall back to
        grep/glob exploration.
      version: 0.1.2
    - name: codebase-memory
      source: ./packages/codebase-memory
      category: code-intelligence
      tags:
        - skill
        - code-intelligence
        - graph
      description: >-
        Structured graph queries against the indexed code graph: trace
        callers/callees, find references, map architecture. Requires the
        codebase-memory-mcp server; for lightweight orientation, use explore.
      version: 0.1.2
    - name: commit-push-merge
      source: ./packages/commit-push-merge
      category: project-lifecycle
      tags:
        - skill
        - lifecycle
        - git
      description: >-
        Commit local changes when needed, push, and merge a branch after
        inferring or confirming the target and merge method.
      version: 0.1.2
    - name: commit-push-pr
      source: ./packages/commit-push-pr
