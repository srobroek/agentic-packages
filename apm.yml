      source: srobroek/agentic-packages
      subdir: .apm/agents/speckit-implement-task.agent.md
      ref: main
    - name: agent-speckit-research
      description: "Researches current primary-source library or API documentation for a SpecKit decision and returns concise findings. Use only inside a SpecKit workflow when the parent provides a library, API, or implementation question tied to a spec or task."
      source: srobroek/agentic-packages
      subdir: .apm/agents/speckit-research.agent.md
      ref: main
    - name: agent-speckit-sync-conflicts
      description: "Detects contradictions between active SpecKit specs or between specs and shared contracts/interfaces. Use for inter-spec conflict audits when scopes overlap, supersession is unclear, or shared API/data assumptions may disagree."
      source: srobroek/agentic-packages
      subdir: .apm/agents/speckit-sync-conflicts.agent.md
      ref: main
    - name: agent-speckit-sync
      description: "Detects drift between active SpecKit artifacts and implementation, including stale specs, missing code, and unspecced covered-scope behavior. Use for SpecKit sync/drift audits, not final FR/SC acceptance verification."
      source: srobroek/agentic-packages
      subdir: .apm/agents/speckit-sync.agent.md
      ref: main
    - name: agent-speckit-verify-tasks
      description: "Detects phantom SpecKit completions by checking completed tasks or closed spec issues against real implementation evidence in fresh context. Use after task completion claims when confirmation bias must be avoided."
      source: srobroek/agentic-packages
      subdir: .apm/agents/speckit-verify-tasks.agent.md
      ref: main
    - name: agent-speckit-verify
      description: "Validates implemented code against a target SpecKit spec's FR/SC requirements and acceptance intent. Use for final or checkpoint SpecKit adherence verification, not broad drift discovery or task checkbox audits."
      source: srobroek/agentic-packages
      subdir: .apm/agents/speckit-verify.agent.md
      ref: main
