    - name: hooks-bash-safety
      source: ./packages/hooks-bash-safety
      category: project-lifecycle
      tags:
        - hooks
        - bash
        - safety
      description: >-
        Bash safety guards: block privilege escalation, curl|sh pipes, and
        obviously destructive filesystem ops; soft-confirm rm -rf on non-system
