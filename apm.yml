        Codex).
      version: 0.2.1
    - name: hooks-branch-check
      source: ./packages/hooks-branch-check
      category: project-lifecycle
      tags:
        - hooks
        - git
        - branch
      description: >-
        Branch awareness hook: on prompt submit, warn when work starts on a
        protected branch (main/master/develop) and surface relevant feature
        branches/worktrees. Advisory context only, never blocks. Cross-tool
        (Claude + Codex).
      version: 0.2.1
    - name: hooks-git-safety
      source: ./packages/hooks-git-safety
      category: project-lifecycle
      tags:
        - hooks
        - git
        - safety
      description: >-
        Git safety guards: block destructive git operations (reset --hard, force
        push, branch/stash/tag deletion, worktree remove) and throttle large gh
        CLI batches toward a rate-limit-aware helper. Cross-tool (Claude +
        Codex).
      version: 0.2.1
    - name: hooks-git-workflow
      source: ./packages/hooks-git-workflow
      category: project-lifecycle
      tags:
        - hooks
        - git
        - commit
      description: >-
        Opt-in git workflow hooks: gate commits on passing tests, track
        edit-vs-test state, and warn about uncommitted work at session end.
        Cross-tool (Claude + Codex).
      version: 0.1.1
    - name: hooks-no-ff
      source: ./packages/hooks-no-ff
      category: project-lifecycle
      tags:
        - hooks
        - git
        - policy
      description: >-
        Opinionated git policy hook: require --no-ff on git merge so
        feature-branch history is preserved. Blocks fast-forward merges.
        Cross-tool (Claude + Codex).
      version: 0.2.0
    - name: hooks-quality
      source: ./packages/hooks-quality
      category: quality
      tags:
        - hooks
        - quality
        - lint
      description: >-
        Opt-in code-quality hooks: advisory linting/formatting feedback after
        edits and a quality check before commits. Cross-tool (Claude + Codex).
      version: 0.1.1
    - name: hooks-squash-merge
      source: ./packages/hooks-squash-merge
      category: project-lifecycle
      tags:
        - hooks
        - git
        - policy
      description: >-
        Opinionated git policy hook: require an explicit merge strategy on gh pr
        merge (--squash for feature PRs, --merge for release PRs). Blocks
        strategy-less PR merges. Cross-tool (Claude + Codex).
      version: 0.2.1
    - name: hooks-tool-prefs
      source: ./packages/hooks-tool-prefs
      category: project-lifecycle
      tags:
        - hooks
        - tooling
        - advisory
      description: >-
        Opinionated advisory hook: suggest preferred tools over deprecated ones
        (rg over grep, fd over find, pnpm over npm, uv over pip, mise over
        nvm/pyenv, just over make). Advisory only, never blocks. Cross-tool
        (Claude + Codex).
      version: 0.2.1
    - name: hooks-worktree
      source: ./packages/hooks-worktree
      category: project-lifecycle
      tags:
        - hooks
        - worktree
        - lifecycle
      description: >-
        Worktree lifecycle hooks: create worktrees outside the repo tree (in
        /tmp) to prevent nesting, and clean up the worktree directory and branch
        on removal. Claude WorktreeCreate/WorktreeRemove events.
      version: 0.2.0
