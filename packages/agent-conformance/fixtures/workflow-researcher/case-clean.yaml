agent: workflow-researcher
regime: clean
prompt: |
  ASSIGN queue:research

  No beads tool is available. Report the dispatch refusal
  as a BLOCKED status with reason "no-compatible-work".
assert:
  first_line: '^STATUS: (?:REPORTED|BLOCKED|ASK)\b'
  max_words: 80
  no_reprint: true
timeout_s: 120
