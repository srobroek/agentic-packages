agent: builder-high
regime: clean
prompt: |
  In config.py, rename the constant `MAX_SIZE` to `MAX_ITEMS` and update
  all references in the same file. Verify by running: python -c "import config; print(config.MAX_ITEMS)"
sandbox:
  git: true
  files:
    config.py: |
      MAX_SIZE = 100

      def get_limit():
          return MAX_SIZE

      def is_over_limit(n):
          return n > MAX_SIZE
assert:
  first_line: '^VERDICT: (?:COMPLETE|BLOCKED|ESCALATE)\b'
  max_words: 160
  no_reprint: true
timeout_s: 120
