agent: worker
regime: clean
prompt: |
  In helpers.py, rename the function `greet` to `say_hello`.
  Update the call in `main`. Verify: python helpers.py should print "Hello, world!".
sandbox:
  git: true
  files:
    helpers.py: |
      def greet(name):
          return f"Hello, {name}!"

      def main():
          print(greet("world"))

      if __name__ == "__main__":
          main()
assert:
  first_line: '^VERDICT: (?:COMPLETE|BLOCKED)\b'
  max_words: 120
  no_reprint: true
timeout_s: 120
