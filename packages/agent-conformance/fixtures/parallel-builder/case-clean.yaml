agent: parallel-coder
regime: clean
prompt: |
  In lib/math.py, rename `square` to `sq` and update the call in `cube`.
  Commit the change with message "rename square to sq".
sandbox:
  git: true
  files:
    lib/math.py: |
      def square(n):
          return n * n

      def cube(n):
          return n * square(n)
assert:
  first_line: '^Branch'
  max_words: 120
  no_reprint: true
timeout_s: 120
