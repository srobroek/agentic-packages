name: worktrunk-writer
version: 2.1.1
description: >-
  Reusable Worktrunk writer lifecycle for Claude and Codex. Pre-creates named
  worktrees, copies only allowlisted ignored files, records a branch lease,
  validates writer paths before mutation, consumes Worktrunk schema-2 JSON fleet
  evidence, and delegates merge and removal safety to Worktrunk. Beads metadata
  is joined when the repository has an active beads workspace. Worktrunk's
  native plugins remain the owner of runtime activity markers and lifecycle
  events.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
targets:
  - claude
  - codex
includes: auto
category: project-lifecycle
tags:
  - worktrunk
  - worktree
  - agents
  - isolation
  - lifecycle
