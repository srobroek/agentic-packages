name: core
version: 1.1.1
description: >-
  Baseline bundle for any repo: layers the project-lifecycle, code-intelligence,
  and agentic-maintenance sub-bundles, plus resume-session, the Matt Pocock
  grill workflows, and the Hobson context/orchestration plugins.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: core
tags:
  - bundle
  - baseline
dependencies:
  apm:
    - srobroek/agentic-packages/packages/project-lifecycle#^0.2.0
    - srobroek/agentic-packages/packages/code-intelligence#^0.2.0
    - srobroek/agentic-packages/packages/agentic-maintenance#^0.2.0
    - srobroek/agentic-packages/packages/resume-session#^0.2.1
    - mattpocock/skills/skills/productivity/grill-me#main
    - mattpocock/skills/skills/engineering/grill-with-docs#main
    - wshobson/agents/plugins/context-management#main
    - wshobson/agents/plugins/agent-orchestration#main
