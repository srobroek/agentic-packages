name: core
version: 0.1.0
description: >-
  Meta-bundle for the shared project baseline. Aggregates the project-lifecycle,
  code-intelligence, and agentic-maintenance bundles, plus grill/diagnose
  workflows and context/orchestration plugins. Install this to get a sensible
  default toolkit for any repo.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
dependencies:
  apm:
    - >-
      srobroek/agentic-packages/packages/project-lifecycle#project-lifecycle-v0.1.0
    - >-
      srobroek/agentic-packages/packages/code-intelligence#code-intelligence-v0.1.0
    - >-
      srobroek/agentic-packages/packages/agentic-maintenance#agentic-maintenance-v0.1.0
    - mattpocock/skills/skills/engineering/diagnose#main
    - mattpocock/skills/skills/productivity/grill-me#main
    - mattpocock/skills/skills/engineering/grill-with-docs#main
    - wshobson/agents/plugins/context-management#main
    - wshobson/agents/plugins/agent-orchestration#main
