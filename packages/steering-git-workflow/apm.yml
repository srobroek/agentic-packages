name: steering-git-workflow
version: 4.1.0
description: >-
  Git workflow policy: branch discipline, ship-path choice (merge vs PR), merge
  flags, draft-first PRs, Beads merge-bead linkage, and pre-push verification.
  Ships a dual-runtime PreToolUse guard that denies non-draft PR creation.
  Replaces the retired commit-push-* skills and git nudge hooks.
