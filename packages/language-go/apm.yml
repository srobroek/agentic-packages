name: language-go
version: 5.1.0
description: 'Go toolkit: quality, steering, and Serena semantic code tools.'
author: Sjors Robroek
license: Apache-2.0
type: hybrid
includes: auto
category: languages
tags:
  - bundle
  - go
dependencies:
  apm:
    - srobroek/agentic-packages/packages/go-quality#>=2.2.0 <3.0.0
    - srobroek/agentic-packages/packages/mcp-serena#>=1.5.0 <2.0.0
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: bash
      args:
        - '-lc'
        - >-
          launcher_rel="apm_modules/srobroek/agentic-packages/packages/mcp-serena/scripts/serena-pool.py";
          for launcher in "$PWD/$launcher_rel" "${APM_HOME:-}/$launcher_rel"
          "${HOME}/.apm/$launcher_rel" "$PWD/.apm/$launcher_rel"; do [ -r
          "$launcher" ] && exec python3 "$launcher"; done; echo
          serena-apm-launcher-not-found-run-apm-install >&2; exit 1
