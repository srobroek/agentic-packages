schema_version: "1.0"
workflow:
  id: "speckit-full"
  name: "Speckit Full Steering Cycle"
  version: "1.0.0"
  author: "sjors"
  description: "Runs the full steering flow from specification through dependency sync, implementation, verification, review, cleanup, conflict checks, retrospective, and checkpoint."

inputs:
  feature_name:
    type: string
    required: true
    prompt: "Feature name"
  integration:
    type: string
    default: "codex"
    prompt: "Integration to use (e.g. codex, claude, copilot, gemini)"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: review-clarify
    type: gate
    message: "Review the clarified specification and checklist before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  # critique + security-review are a parallel pair in the DAG; the workflow
  # schema has no parallel primitive, so they run as adjacent sequential steps.
  - id: critique
    command: speckit.critique.run
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: security-review
    command: speckit.security-review
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: checkpoint-spec
    type: prompt
    prompt: "Commit all spec/plan changes with a conventional commit message. Tag this as the pre-implementation checkpoint. Task state lives in beads (bd ready / bd swarm status), not in files or GitHub issues."

  - id: review-implementation-ready
    type: gate
    message: "Review critique, security review, tasks, analysis, and checkpoint evidence before implementation."
    options: [approve, reject]
    on_reject: abort

  # Implementation routes through the agent-assign flow, not the deprecated
  # /speckit.implement command.
  - id: assign
    command: speckit.agent-assign.assign
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: validate
    command: speckit.agent-assign.validate
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: execute
    command: speckit.agent-assign.execute
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_name }}"

  - id: verify-tasks
    type: prompt
    prompt: "Confirm every child of the implement bead is closed with bd children <implement-step-id> --json, then spawn the speckit-verify agent with mode: tasks. Pass the spec ID, implementation task beads, spec.md, and changed files. Write verify-tasks-report.md."

  - id: verify
    type: prompt
    prompt: "Spawn the speckit-verify agent with mode: requirements. Pass the spec ID, spec.md, plan.md, implementation task beads, and implementation directories. Write verify-report.md."

  - id: review
    command: speckit.review.run
    integration: "{{ inputs.integration }}"

  - id: qa
    command: speckit.qa.run
    integration: "{{ inputs.integration }}"

  - id: code-review
    type: prompt
    prompt: "Run /speckit.review.code as a subagent and bond mol-speckit-fix-findings when actionable findings exist."

  - id: security-review-post
    type: prompt
    prompt: "Run /speckit.security-review.branch as a subagent and bond mol-speckit-fix-findings when actionable findings exist."

  - id: cleanup
    command: speckit.cleanup.run
    integration: "{{ inputs.integration }}"

  - id: sync
    command: speckit.sync.analyze
    integration: "{{ inputs.integration }}"

  - id: sync-conflicts
    command: speckit.sync.conflicts
    integration: "{{ inputs.integration }}"

  - id: retro
    command: speckit.retro.run
    integration: "{{ inputs.integration }}"

  - id: docs-update
    type: prompt
    prompt: "Update released-artifact documentation for the feature."

  - id: review-closeout
    type: gate
    message: "Review verification, review, QA, security review, cleanup, drift, conflicts, retrospective, and documentation before closeout."
    options: [approve, reject]
    on_reject: abort

  - id: checkpoint-final
    type: prompt
    prompt: "Commit and tag the final feature artifacts. Close the final step and feature molecule root. Run one bd dolt push only when sync authority is granted; otherwise report the pending command."
