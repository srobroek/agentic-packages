schema_version: "1.0"
workflow:
  id: "speckit-quality"
  name: "Speckit Quality Gates"
  version: "1.0.0"
  author: "sjors"
  description: "Runs verification, review, QA, security review, cleanup, drift checks, retrospective, documentation, and closeout."

inputs:
  integration:
    type: string
    default: "codex"
    prompt: "Integration to use (e.g. codex, claude, copilot, gemini)"

steps:
  - id: verify-tasks
    type: prompt
    prompt: "Confirm every child of the implement bead is closed with bd children <implement-step-id> --json, then spawn the speckit-verify agent with mode: tasks. Pass the spec ID, implementation task beads, spec.md, and changed files. Write verify-tasks-report.md."

  - id: verify
    type: prompt
    prompt: "Spawn the speckit-verify agent with mode: requirements. Pass the spec ID, spec.md, plan.md, implementation task beads, and implementation directories. Write verify-report.md."

  - id: review
    command: speckit.review.run
    integration: "{{ inputs.integration }}"

  - id: qa
    command: speckit.qa.run
    integration: "{{ inputs.integration }}"

  - id: code-review
    type: prompt
    prompt: "Run /speckit.review.code as a subagent and bond mol-speckit-fix-findings when actionable findings exist."

  - id: security-review-post
    type: prompt
    prompt: "Run /speckit.security-review.branch as a subagent and bond mol-speckit-fix-findings when actionable findings exist."

  - id: cleanup
    command: speckit.cleanup.run
    integration: "{{ inputs.integration }}"

  - id: sync
    command: speckit.sync.analyze
    integration: "{{ inputs.integration }}"

  - id: sync-conflicts
    command: speckit.sync.conflicts
    integration: "{{ inputs.integration }}"

  - id: retro
    command: speckit.retro.run
    integration: "{{ inputs.integration }}"

  - id: docs-update
    type: prompt
    prompt: "Update released-artifact documentation for the feature."

  - id: review-closeout
    type: gate
    message: "Review verification, review, QA, security review, cleanup, drift, conflicts, retrospective, and documentation before closeout."
    options: [approve, reject]
    on_reject: abort

  - id: checkpoint-final
    type: prompt
    prompt: "Commit and tag the final feature artifacts. Close the final step and feature molecule root. Run one bd dolt push only when sync authority is granted; otherwise report the pending command."
