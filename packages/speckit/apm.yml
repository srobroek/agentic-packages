name: speckit
version: 0.5.1
description: >-
  SpecKit mechanism: the six SpecKit agents and the bugfix and setup skills. Opt
  into the opinionated layers separately: steering-speckit (the mandatory-gated
  workflow) and speckit-dag-hooks (the DAG dispatcher + enforcement hooks).
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: speckit
tags:
  - bundle
  - speckit
dependencies:
  apm:
    # The memory-md MCP server. setup-speckit.sh installs + builds the
    # memory-md extension; this registers its stdio MCP server with the harness
    # so /speckit.memory-md.* prompts use the native tools instead of npx.
    - srobroek/agentic-packages/packages/mcp-speckit-memory#^0.1.0
