name: speckit
version: 12.0.0
description: >-
  Beads-native SpecKit workflow, whole: four SpecKit agents, the bugfix and setup
  skills, the `speckit-feature` bd formula whose poured molecule is the phase DAG
  with human gates at clarify approval, analyze approval, and verify sign-off,
  steering that maps one spec dir to one molecule root, and a PreToolUse guard
  that denies every Write/Edit to specs/*/tasks.md when a beads workspace is
  active. Task state lives in beads and tasks.md is never authored; reads stay
  allowed for legacy migration. Requires the bd CLI (gastownhall/beads >= 1.1.0)
  and python3 on PATH; guard and steering are inert in repos without .beads/. The
  setup skill installs the formula into the repo's .beads/formulas/.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: speckit
tags:
  - bundle
  - speckit
  - beads
  - workflow
  - gates
dependencies:
  apm:
    - srobroek/agentic-packages/packages/beads#>=1.0.0 <2.0.0
    # The DECISIONS block names which SpecKit phases produce a decision record but
    # deliberately owns none of the mechanics. Without this dependency an agent
    # reads "register a choice" with no format, path, or gate behind it.
    - srobroek/agentic-packages/packages/adr-as-beads#>=1.0.0 <2.0.0
