name: speckit-dag-hooks
version: 4.0.0
description: >-
  DEPRECATED — superseded by speckit-gate (github.com/srobroek/speckit-gate).
  Kept for existing installs; no new features. Opt-in enforcement hooks for the
  SpecKit DAG: hard-block out-of-order or precondition-violating /speckit.*
  commands via the speckit-dag dispatcher. Opinionated mandatory-gating --
  requires the speckit package (which ships the dispatcher) to be installed.
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: speckit
tags:
  - bundle
  - speckit
  - hooks
dependencies:
  apm:
    - srobroek/agentic-packages/packages/speckit#>=4.0.0 <5.0.0
