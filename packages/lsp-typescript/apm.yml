name: lsp-typescript
version: 0.3.0
description: >-
  TypeScript/JavaScript LSP server: registers typescript-language-server so
  agents get hover, diagnostics, go-to-definition, and references on TS/JS
  sources. Installed transitively by the language-typescript bundle; also
  installable on its own. Requires typescript-language-server on PATH (APM
  writes the config; it does not install the binary).
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: claude
includes: auto
category: languages
tags:
  - lsp
  - typescript
dependencies:
  lsp:
    - name: typescript-language-server
      command: typescript-language-server
      args:
        - '--stdio'
      extensionToLanguage:
        .ts: typescript
        .tsx: typescriptreact
        .js: javascript
        .jsx: javascriptreact
        .mjs: javascript
        .cjs: javascript
      transport: stdio
