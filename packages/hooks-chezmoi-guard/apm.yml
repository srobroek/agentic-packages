name: hooks-chezmoi-guard
version: 1.0.0
description: >-
  PreToolUse guard that denies direct edits and shell writes to files chezmoi
  ACTUALLY manages (exact membership in `chezmoi managed`, 60s cache), steering
  changes to the chezmoi source. Read-only references and unmanaged paths pass.
  Cross-tool (Claude + Codex).
author: Sjors Robroek
license: Apache-2.0
type: hooks
target: all
includes: auto
category: project-lifecycle
tags:
  - hooks
  - chezmoi
  - dotfiles
  - safety
