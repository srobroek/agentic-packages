name: mcp-serena-codex
version: 0.1.0
description: 'MCP package: Serena MCP server package for Codex semantic code tools. Contains: MCP servers serena.'
author: Sjors Robroek
license: MIT
type: hybrid
target: codex
includes: auto

dependencies:
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: serena
      args:
        - start-mcp-server
        - --context=codex
        - --project-from-cwd
