name: steering-speckit
version: 4.0.0
description: >-
  Opinionated SpecKit workflow steering: the mandatory-gated Phase 1/2/3 DAG,
  human-gating rules, and command reference. Names which phases produce a
  decision record and defers the format, path, and gate to the adr package.
  Opt-in -- install alongside the speckit package to adopt this specific
  spec-driven process.
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: steering
tags:
  - steering
  - speckit
dependencies:
  apm:
    - srobroek/agentic-packages/packages/adr-as-beads#>=1.0.0 <2.0.0
