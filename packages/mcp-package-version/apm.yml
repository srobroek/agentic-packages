name: mcp-package-version
version: 0.1.0 # x-release-please-version
description: "MCP server package for Package Version, providing dependency version discovery before adding or upgrading packages."
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: mcp
tags:
  - bundle
  - mcp
  - dependencies

dependencies:
  mcp:
    - name: mcp-package-version
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - mcp-package-version
