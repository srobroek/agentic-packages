    - srobroek/agentic-packages/packages/codebase-memory#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/mcp-codebase-memory#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/explore#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/research#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/web-fetch#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/agent-pr-reviewer#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/steering-project-structure#>=1.0.0 <2.0.0
    - wshobson/agents/plugins/code-documentation#main
    - wshobson/agents/plugins/documentation-generation#main
    - wshobson/agents/plugins/c4-architecture#main
