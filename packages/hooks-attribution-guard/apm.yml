name: hooks-attribution-guard
version: 1.0.0
description: >-
  Blocks git commits that carry AI authorship attribution (Co-Authored-By
  Claude/Anthropic, "Generated with/by AI", "AI-assisted/AI-generated", Claude
  Code trailers), enforcing that the human is the sole author of record. Scoped
  to attribution trailers/phrases so prose mentioning AI is not blocked.
  Cross-tool (Claude + Codex).
author: Sjors Robroek
license: Apache-2.0
type: hooks
target: all
includes: auto
category: project-lifecycle
tags:
  - hooks
  - git
  - attribution
