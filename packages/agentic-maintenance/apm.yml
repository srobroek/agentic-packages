name: agentic-maintenance
version: 0.1.1
description: >-
  Maintain your agentic assets: audit and optimize steering, look up prompts,
  write new skills, with the coder and PR reviewer agents. Includes Hobson
  documentation-standards and plugin-eval for evaluating external packages.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
dependencies:
  apm:
    - >-
      srobroek/agentic-packages/packages/optimize-steering#optimize-steering-v0.1.1
    - srobroek/agentic-packages/packages/prompt-lookup#prompt-lookup-v0.1.1
    - srobroek/agentic-packages/packages/audit-steering#audit-steering-v0.1.1
    - srobroek/agentic-packages/packages/write-a-skill#write-a-skill-v0.1.1
    - srobroek/agentic-packages/packages/agent-coder#agent-coder-v0.1.1
    - >-
      srobroek/agentic-packages/packages/agent-pr-reviewer#agent-pr-reviewer-v0.1.1
    - wshobson/agents/plugins/documentation-standards#main
    - wshobson/agents/plugins/plugin-eval#main
