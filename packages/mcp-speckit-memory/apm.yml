name: mcp-speckit-memory
version: 0.1.0
description: >-
  MCP server package for the Spec Kit Memory Hub (memory-md) extension: durable,
  repository-native project memory (decisions, bugs, lessons) with a SQLite cache
  exposed as MCP tools. The launcher resolves the project-local memory-md
  extension and builds its server in-place on first use, since the upstream
  binary is not published to npm.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: mcp
tags:
  - mcp
  - speckit
  - memory
dependencies:
  mcp:
    - name: speckit-memory-hub
      registry: false
      transport: stdio
      command: bash
      args:
        - '-lc'
        # The memory-md extension (DyanGalih/spec-kit-memory-hub) ships TypeScript
        # source but no built dist/ and no node_modules (both gitignored, stripped
        # from the release archive), and `speckit-memory` is NOT on npm -- so the
        # upstream `npx -y speckit-memory mcp-start` cannot work. Resolve the
        # project-local extension dir by walking up from the launch cwd, build the
        # server in-place if the binary is missing (setup-speckit.sh builds it
        # eagerly; this is the fallback), then exec the stdio MCP server.
        - >-
          d="$PWD"; while [ "$d" != / ] && [ ! -d
          "$d/.specify/extensions/memory-md" ]; do d="$(dirname "$d")"; done;
          e="$d/.specify/extensions/memory-md"; if [ ! -d "$e" ]; then echo
          "speckit-memory-hub: memory-md extension not found under $PWD -- run
          setup-speckit.sh first" >&2; exit 1; fi; b="$e/dist/bin/speckit-memory.js";
          if [ ! -f "$b" ]; then echo "speckit-memory-hub: building server in $e"
          >&2; ( cd "$e" && npm install --no-audit --no-fund && npm run build )
          1>&2 || { echo "speckit-memory-hub: build failed (need Node.js >=18 +
          a C toolchain for better-sqlite3)" >&2; exit 1; }; fi; exec node "$b"
          mcp-start
