name: security
version: 0.1.0
description: >-
  Security toolkit: Hobson security-scanning, security-compliance,
  backend-api-security, frontend-mobile-security, and reverse-engineering
  plugins for vulnerability analysis, compliance, and hardening.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
dependencies:
  apm:
    - wshobson/agents/plugins/security-scanning#main
    - wshobson/agents/plugins/security-compliance#main
    - wshobson/agents/plugins/backend-api-security#main
    - wshobson/agents/plugins/frontend-mobile-security#main
    - wshobson/agents/plugins/reverse-engineering#main
