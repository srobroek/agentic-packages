name: agent-builder
version: 9.1.0
description: >-
  Implementation subagent for bounded code changes, tests, and refactors within
  a defined scope. Ships `builder`, which edits the checkout its brief names, in
  place, over a file scope the brief assigns. It commits only when told to and
  never touches build artifacts it did not generate, so the caller keeps control
  of what lands.
