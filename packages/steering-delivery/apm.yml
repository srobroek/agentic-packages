name: steering-delivery
version: 0.2.0
description: >-
  Opinionated delivery cadence: work like a developer who commits continuously.
  Commit and push after every meaningful, self-contained step; keep commits
  atomic; leave no unpushed local work stranded in a local or disposable
  worktree. Always-on steering. Opt-in.
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: steering
tags:
  - steering
  - git
  - commit
  - workflow
