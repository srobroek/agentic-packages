# Code-surface rules for break-stuff. Offline, with no registry fetch.
#
# Invoke with an ABSOLUTE path, because scanners run with cwd set to the target
# repo, and a skill-relative path silently matches nothing. Example:
#   semgrep --config "$BREAK_SKILL_DIR/references/semgrep-rules/taint-sinks.yml" --json <files>
#
# Scope: the sink patterns bandit, gosec, and clippy leave uncovered, plus the
# cross-language cases none of them see. Every match still needs a traced path
# before it rises above HARDENING.
rules:
  - id: break-stuff-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      This deserializer reconstructs arbitrary types, so untrusted input reaches
      code execution. Use a data-only format such as json, or yaml.safe_load.
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)
          - pattern: cPickle.load(...)
          - pattern: cPickle.loads(...)
          - pattern: yaml.load($X)
          - pattern: yaml.load($X, Loader=yaml.Loader)
          - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)
          - pattern: marshal.loads(...)
          - pattern: shelve.open(...)

  - id: break-stuff-python-runtime-exec
    languages: [python]
    severity: ERROR
    message: >-
      exec or eval on a built string runs that string as code. Replace it with a
      dispatch table.
    patterns:
      - pattern-either:
          - pattern: exec(f"...")
          - pattern: exec(... + ...)
          - pattern: eval(f"...")
          - pattern: eval(... + ...)
          - pattern: eval($X % ...)

  - id: break-stuff-path-join-unvalidated
    languages: [python]
    severity: WARNING
    message: >-
      Joining a request or argument value into a path allows traversal with ../
      or an absolute path. Resolve the result and check it stays under a canonical
      root.
    patterns:
      - pattern-either:
          - pattern: open(os.path.join($ROOT, $REQ), ...)
          - pattern: open($ROOT + $REQ, ...)
          - pattern: open(f"{$ROOT}/{$REQ}", ...)
          - pattern: pathlib.Path($ROOT) / $REQ
      - pattern-not: open(os.path.join($ROOT, "..."), ...)

  - id: break-stuff-tar-extractall
    languages: [python]
    severity: ERROR
    message: >-
      extractall writes wherever the archive's entries point, including outside
      the target directory. Filter every member's resolved path before extracting.
    patterns:
      - pattern-either:
          - pattern: $T.extractall(...)
          - pattern: tarfile.open(...).extractall(...)
      - pattern-not: $T.extractall(..., filter=...)

  - id: break-stuff-redos-nested-quantifier
    languages: [python, javascript, typescript]
    severity: WARNING
    message: >-
      A nested quantifier backtracks exponentially on a crafted string, so a
      regex over user input becomes a stall. Rewrite the pattern or bound the
      input length.
    patterns:
      - pattern-regex: '["\x27]\^?[^"\x27]*\([^)"\x27]*[+*]\)[+*]'

  - id: break-stuff-weak-hash-for-auth
    languages: [python, go, javascript, typescript]
    severity: WARNING
    message: >-
      MD5 and SHA1 are broken for authentication and signing. This is a finding
      only when the digest is security-bearing. A cache key or checksum is fine.
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: md5.New()
          - pattern: sha1.New()
          - pattern: crypto.createHash("md5")
          - pattern: crypto.createHash("sha1")

  - id: break-stuff-insecure-random-for-secret
    languages: [python, go, javascript, typescript]
    severity: WARNING
    message: >-
      A non-cryptographic generator produces predictable values. Use secrets,
      crypto/rand, or webcrypto when the value is a token, key, nonce, or salt.
    patterns:
      - pattern-either:
          - pattern: random.random()
          - pattern: random.randint(...)
          - pattern: random.choice(...)
          - pattern: math.Float64()
          - pattern: Math.random()

  - id: break-stuff-tls-verification-disabled
    languages: [python, go, javascript, typescript]
    severity: ERROR
    message: >-
      Disabling certificate verification removes the protection TLS provides
      against an interception. Fix the trust store instead.
    patterns:
      - pattern-either:
          - pattern: requests.$M(..., verify=False, ...)
          - pattern: ssl._create_unverified_context(...)
          - pattern: "InsecureSkipVerify: true"
          - pattern: "rejectUnauthorized: false"
          - pattern: $X.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: break-stuff-sql-string-build
    languages: [python, go, javascript, typescript]
    severity: ERROR
    message: >-
      A query assembled by interpolation lets input change the statement. Use a
      parameterized query.
    patterns:
      - pattern-either:
          - pattern: $C.execute(f"...")
          - pattern: $C.execute("..." % ...)
          - pattern: $C.execute("...".format(...))
          - pattern: $C.execute("..." + ...)
          - pattern: $C.Query(fmt.Sprintf("...", ...))
          - pattern: $C.Exec(fmt.Sprintf("...", ...))
          - pattern: $C.query(`...${...}...`)

  - id: break-stuff-secret-in-log
    languages: [python, go, javascript, typescript]
    severity: WARNING
    message: >-
      Logging a credential writes it wherever the logs go, including aggregators
      and error trackers. Log an identifier instead of the value.
    patterns:
      - pattern-either:
          - pattern-regex: '(?i)log(ger)?\.\w+\([^)]*\b(password|passwd|secret|token|api_?key|private_?key|credential)\b'
          - pattern-regex: '(?i)(print|console\.\w+)\([^)]*\b(password|passwd|secret|token|api_?key|private_?key)\b'

  - id: break-stuff-ssrf-url-from-input
    languages: [python, go, javascript, typescript]
    severity: WARNING
    message: >-
      Fetching a URL built from input reaches internal addresses and cloud
      metadata endpoints. Validate the host against an allowlist before the
      request.
    patterns:
      - pattern-either:
          - pattern: requests.$M(f"...", ...)
          - pattern: requests.$M($URL, ...)
          - pattern: urllib.request.urlopen($URL, ...)
          - pattern: http.Get($URL)
          - pattern: fetch($URL, ...)
      - pattern-not: requests.$M("...", ...)
      - pattern-not: fetch("...", ...)

  - id: break-stuff-xml-external-entity
    languages: [python]
    severity: ERROR
    message: >-
      This XML parser resolves external entities, which reads local files and
      makes outbound requests on the parser's behalf. Use defusedxml.
    patterns:
      - pattern-either:
          - pattern: xml.etree.ElementTree.parse(...)
          - pattern: xml.etree.ElementTree.fromstring(...)
          - pattern: xml.dom.minidom.parse(...)
          - pattern: lxml.etree.parse(...)
