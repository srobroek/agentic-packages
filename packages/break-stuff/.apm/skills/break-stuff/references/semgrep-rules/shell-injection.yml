# Shell-surface rules for break-stuff. Offline, with no registry fetch.
#
# Invoke with an ABSOLUTE path, because scanners run with cwd set to the target
# repo, and a skill-relative path silently matches nothing. Example:
#   semgrep --config "$BREAK_SKILL_DIR/references/semgrep-rules/shell-injection.yml" --json <files>
#
# These complement shellcheck rather than repeating it: shellcheck owns quoting
# and word-splitting syntax, and these own the taint-shaped patterns it misses.
rules:
  - id: break-stuff-eval-on-expansion
    languages: [bash]
    severity: ERROR
    message: >-
      eval on an expanded value executes whatever that value contains. Replace
      eval with a case dispatch or an array invocation.
    patterns:
      - pattern-either:
          - pattern: eval "$...ARG"
          - pattern: eval $...ARG
          - pattern: eval "...$...ARG..."

  - id: break-stuff-curl-pipe-shell
    languages: [bash]
    severity: ERROR
    message: >-
      Piping a download straight into a shell executes remote code with no
      verification. Download to a file, check a hash or signature, then run it.
    patterns:
      - pattern-either:
          - pattern: curl ... | sh ...
          - pattern: curl ... | bash ...
          - pattern: wget ... | sh ...
          - pattern: wget ... | bash ...

  - id: break-stuff-mktemp-without-template
    languages: [bash]
    severity: WARNING
    message: >-
      A predictable temp path lets another process pre-create or symlink it.
      Use mktemp with a template, and quote the result.
    patterns:
      - pattern-either:
          - pattern: $F=/tmp/$NAME
          - pattern: $F="/tmp/$NAME"
          - pattern: $F=/tmp/$NAME.$$
          - pattern: $F="/tmp/$NAME.$$"

  - id: break-stuff-source-from-variable
    languages: [bash]
    severity: ERROR
    message: >-
      Sourcing a path from a variable executes that file in the current shell.
      Validate the path against a fixed allowlist before sourcing it.
    patterns:
      - pattern-either:
          - pattern: source "$...F"
          - pattern: source $...F
          - pattern: . "$...F"

  - id: break-stuff-indirect-expansion
    languages: [bash]
    severity: WARNING
    message: >-
      Indirect expansion reads a variable whose name comes from data, which lets
      input select which variable is read. Use a case dispatch instead.
    pattern: ${!$VAR}

  - id: break-stuff-rm-rf-on-variable
    languages: [bash]
    severity: ERROR
    message: >-
      rm -rf on an expansion deletes the wrong tree when the variable is unset or
      contains a leading slash. Set -u, validate against a fixed prefix, and
      quote the expansion.
    patterns:
      - pattern-either:
          - pattern: rm -rf $...P
          - pattern: rm -rf "$...P"
          - pattern: rm -fr $...P
          - pattern: rm -rf "$...P"/...
      - pattern-not: rm -rf "${...P:?}"
      - pattern-not: rm -rf "${...P:?}"/...

  - id: break-stuff-command-in-unquoted-test
    languages: [bash]
    severity: WARNING
    message: >-
      A command substitution in an unquoted single-bracket test word-splits, so a
      value with a space changes the test's arity and its result.
    patterns:
      - pattern-either:
          - pattern: '[ $(...) = $... ]'
          - pattern: '[ $... = $(...) ]'

  - id: break-stuff-path-from-input
    languages: [bash]
    severity: WARNING
    message: >-
      PATH assembled from an expansion lets input insert a directory ahead of the
      real binaries, so every later command may run an attacker's file.
    patterns:
      - pattern-either:
          - pattern: export PATH="$...V:$PATH"
          - pattern: PATH="$...V:$PATH"
          - pattern: export PATH=$...V:$PATH
      - pattern-not: export PATH="/=:$PATH"

  - id: break-stuff-python-shell-true-format
    languages: [python]
    severity: ERROR
    message: >-
      subprocess with shell=True on a built string runs the shell on that string.
      Pass an argument list and drop shell=True.
    patterns:
      - pattern-either:
          - pattern: subprocess.$F(f"...", ..., shell=True, ...)
          - pattern: subprocess.$F("..." % ..., ..., shell=True, ...)
          - pattern: subprocess.$F("...".format(...), ..., shell=True, ...)
          - pattern: subprocess.$F(... + ..., ..., shell=True, ...)
          - pattern: os.system(f"...")
          - pattern: os.system("..." % ...)
          - pattern: os.system(... + ...)

  - id: break-stuff-hook-bare-except-allow
    languages: [python]
    severity: WARNING
    message: >-
      A guard that swallows every exception and continues decides nothing on
      malformed input. Emit an explicit decision in the handler so the fail-open
      or fail-closed choice is visible in the code.
    patterns:
      - pattern: |
          try:
              ...
          except Exception:
              pass
