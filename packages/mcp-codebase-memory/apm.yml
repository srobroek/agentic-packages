name: mcp-codebase-memory
version: 1.2.3
description: >-
  MCP server package for the Codebase Memory MCP, providing graph-aware project
  orientation (symbol search, call paths, code snippets). Available but not
  wired by default; requires explicit installation and index build.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
category: mcp
tags:
  - mcp
  - codebase
dependencies:
  mcp:
    - name: codebase-memory-mcp
      registry: false
      transport: stdio
      command: codebase-memory-mcp
