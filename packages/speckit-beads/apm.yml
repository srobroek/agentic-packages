name: speckit-beads
version: 3.3.0
description: >-
  Beads-native SpecKit workflow: ships the speckit-feature bd formula (the
  SpecKit phase spine as a molecule DAG with human gates at clarify approval,
  analyze approval, and verify sign-off), steering that maps one spec dir to one
  molecule root epic and implementation task beads to the implement step, and a
  PreToolUse guard that denies every Write/Edit to specs/*/tasks.md when a beads
  workspace is active — task state lives in beads and tasks.md is never authored
  (reads stay allowed for legacy migration). Replaces the archived speckit-gate
  gates.yaml engine. Requires the bd CLI (gastownhall/beads >= 1.1.0); guard and
  steering are inert in repos without .beads/. Install the formula by copying
  formulas/speckit-feature.formula.toml into the repo's .beads/formulas/.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: speckit
tags:
  - speckit
  - beads
  - workflow
  - gates
dependencies:
  apm:
    - srobroek/agentic-packages/packages/speckit#>=8.1.1 <9.0.0
    - srobroek/agentic-packages/packages/beads#>=0.6.0 <1.0.0
