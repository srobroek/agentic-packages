# speckit-feature -- the SpecKit phase spine as a beads molecule.
#
# Install: copy this file into <repo>/.beads/formulas/ (or ~/.beads/formulas/).
# Pour one molecule per feature:
#   bd mol pour speckit-feature --var feature=<NNN-slug>
#
# Authoring gotchas (verified against bd 1.1.0):
#   - [steps.gate] must be a TOML table, not a string.
#   - Unknown keys are silently dropped; after editing, verify with
#     `bd formula show speckit-feature --json`.
#   - Step `type` accepts only task|bug|feature|epic|chore. Do NOT use
#     `epic` inside a molecule: pour rejects epic->task blocking deps
#     ("epics can only block other epics"). Plain tasks parent child beads
#     fine (hierarchical IDs), so `implement` is a task.
formula = "speckit-feature"
description = "SpecKit feature workflow for {{feature}}: specify through retro with human approval gates"
type = "workflow"

[vars.feature]
required = true
pattern = "^[0-9]{3}-[a-z0-9-]+$"

[[steps]]
id = "specify"
title = "specify {{feature}}"
type = "task"
description = "Run /speckit.specify to create specs/{{feature}}/spec.md."

[steps.metadata]
execution_skill = "speckit.specify"

[[steps]]
id = "clarify"
title = "clarify {{feature}}"
type = "task"
needs = ["specify"]
description = "Run /speckit.clarify (interactive) and encode answers into spec.md."

[steps.metadata]
execution_skill = "speckit.clarify"
execution_mode = "interactive"

[[steps]]
id = "clarify-approval"
title = "clarify approval {{feature}}"
type = "task"
needs = ["clarify"]
description = "Human sign-off on the clarified spec. Close the gate only after the user approves interactively."

[steps.gate]
type = "human"

[[steps]]
id = "plan"
title = "plan {{feature}}"
type = "task"
needs = ["clarify-approval"]
description = "Run /speckit.plan to produce plan.md and design artifacts."

[steps.metadata]
execution_skill = "speckit.plan"

[[steps]]
id = "checklist"
title = "checklist {{feature}}"
type = "task"
needs = ["tasks"]
description = "Run /speckit.checklist (interactive requirements-quality gate)."

[steps.metadata]
execution_skill = "speckit.checklist"
execution_mode = "interactive"

[[steps]]
id = "tasks"
title = "tasks {{feature}}"
type = "task"
needs = ["plan"]
description = "Run /speckit.tasks, then create the task breakdown as child beads of the implement step (bd create --parent <implement-id> --spec-id {{feature}}). Never write specs/{{feature}}/tasks.md; the write is denied."

[steps.metadata]
execution_skill = "speckit.tasks"

[[steps]]
id = "critique"
title = "critique {{feature}}"
type = "task"
needs = ["checklist"]
description = "Run /speckit.critique.run (mandatory plan + task quality gate). Parallel with security-review."

[steps.metadata]
execution_skill = "speckit.critique.run"

[[steps]]
id = "security-review"
title = "security review {{feature}}"
type = "task"
needs = ["checklist"]
description = "Run /speckit.security-review (mandatory security review of plan/tasks). Parallel with critique."

[steps.metadata]
execution_skill = "speckit.security-review"

[[steps]]
id = "analyze"
title = "analyze {{feature}}"
type = "task"
needs = ["critique", "security-review"]
description = "Run /speckit.analyze (interactive cross-artifact risk analysis). Task state comes from bd list --spec-id {{feature}}, not tasks.md."

[steps.metadata]
execution_skill = "speckit.analyze"
execution_mode = "interactive"

[[steps]]
id = "analyze-approval"
title = "analyze approval {{feature}}"
type = "task"
needs = ["analyze"]
description = "Human sign-off on analysis findings. Close the gate only after the user approves interactively."

[steps.gate]
type = "human"

[[steps]]
id = "assign"
title = "agent assign {{feature}}"
type = "task"
needs = ["analyze-approval"]
description = "Run /speckit.agent-assign.assign to map implementation task beads to agents."

[steps.metadata]
execution_skill = "speckit.agent-assign.assign"

[[steps]]
id = "validate"
title = "validate assignments {{feature}}"
type = "task"
needs = ["assign"]
description = "Run /speckit.agent-assign.validate to confirm every assigned agent exists."

[steps.metadata]
execution_skill = "speckit.agent-assign.validate"

[[steps]]
id = "implement"
title = "implement {{feature}}"
type = "task"
needs = ["validate"]
description = "Run /speckit.agent-assign.execute. Implementation task beads are children of this step; work them via bd ready -> bd update <id> --claim -> bd close <id> --reason."

[steps.metadata]
execution_skill = "speckit.agent-assign.execute"

[[steps]]
id = "verify-tasks"
title = "verify tasks {{feature}}"
type = "task"
needs = ["implement"]
labels = ["agent:speckit-verify"]
description = "Spawn the speckit-verify agent (mode: tasks) for phantom-completion detection; writes verify-tasks-report.md."

[steps.metadata]
execution_agent_type = "speckit-verify"
execution_agent_mode = "tasks"
execution_mode = "subagent"

[[steps]]
id = "verify"
title = "verify {{feature}}"
type = "task"
needs = ["verify-tasks"]
labels = ["agent:speckit-verify"]
description = "Spawn the speckit-verify agent (mode: requirements) to validate code against spec.md; writes verify-report.md."

[steps.metadata]
execution_agent_type = "speckit-verify"
execution_agent_mode = "requirements"
execution_mode = "subagent"

[[steps]]
id = "verify-signoff"
title = "verify sign-off {{feature}}"
type = "task"
needs = ["verify"]
description = "Final human sign-off on the verification reports. Close the gate only after the user approves interactively."

[steps.gate]
type = "human"

[[steps]]
id = "review"
title = "review {{feature}}"
type = "task"
needs = ["verify-signoff"]
description = "Run /speckit.review.run (full review cycle); route findings through fix-findings."

[steps.metadata]
execution_skill = "speckit.review.run"

[[steps]]
id = "qa"
title = "qa {{feature}}"
type = "task"
needs = ["review"]
description = "Run /speckit.qa.run; failures route through fix-findings."

[steps.metadata]
execution_skill = "speckit.qa.run"

[[steps]]
id = "code-review"
title = "code review {{feature}}"
type = "task"
needs = ["qa"]
description = "Run /speckit.review.code as a subagent. Parallel with security-review-post."

[steps.metadata]
execution_skill = "speckit.review.code"
execution_mode = "subagent"

[[steps]]
id = "security-review-post"
title = "post-implementation security review {{feature}}"
type = "task"
needs = ["qa"]
description = "Run /speckit.security-review.branch as a subagent. Parallel with code-review."

[steps.metadata]
execution_skill = "speckit.security-review.branch"
execution_mode = "subagent"

[[steps]]
id = "cleanup"
title = "cleanup {{feature}}"
type = "task"
needs = ["code-review", "security-review-post"]
description = "Run /speckit.cleanup (post-implementation quality gate) on the main thread."

[steps.metadata]
execution_skill = "speckit.cleanup"

[[steps]]
id = "sync-drift"
title = "sync drift {{feature}}"
type = "task"
needs = ["cleanup"]
labels = ["agent:speckit-sync"]
description = "Spawn the speckit-sync agent (scope: drift) to detect spec/implementation drift. Parallel with sync-conflicts."

[steps.metadata]
execution_agent_type = "speckit-sync"
execution_agent_scope = "drift"
execution_mode = "subagent"

[[steps]]
id = "sync-conflicts"
title = "sync conflicts {{feature}}"
type = "task"
needs = ["cleanup"]
labels = ["agent:speckit-sync"]
description = "Spawn the speckit-sync agent (scope: conflicts) to detect inter-spec contradictions. Parallel with sync-drift."

[steps.metadata]
execution_agent_type = "speckit-sync"
execution_agent_scope = "conflicts"
execution_mode = "subagent"

[[steps]]
id = "retro"
title = "retro {{feature}}"
type = "task"
needs = ["sync-drift", "sync-conflicts"]
description = "Run /speckit.retro.run."

[steps.metadata]
execution_skill = "speckit.retro.run"

[[steps]]
id = "docs-update"
title = "documentation update {{feature}}"
type = "task"
needs = ["retro"]
description = "Update user-facing documentation for the shipped feature on the main thread."

[[steps]]
id = "final-checkpoint"
title = "final checkpoint {{feature}}"
type = "task"
needs = ["docs-update"]
description = "Final commit + tag (git, no extension), then close out the molecule (bd dolt push)."
