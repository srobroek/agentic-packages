name: hooks-package-investigate
version: 2.1.0
description: >-
  Non-blocking PreToolUse Bash hook that nudges the agent to investigate a
  dependency's trustworthiness, maintenance, quality, popularity, and
  alternatives BEFORE adding/installing it (lighter review for
  update/upgrade/remove). Requires python3 on PATH. Cross-tool (Claude + Codex).
