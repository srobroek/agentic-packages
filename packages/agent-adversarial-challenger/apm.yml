name: agent-adversarial-challenger
version: 0.1.0
description: >-
  Read-only adversarial challenger: independently stress-tests a plan,
  hypothesis, design, or fix by attacking its assumptions and returning
  evidence-backed counter-arguments and alternatives, without editing files. The
  critic half of a generate/critique loop; the unstuck debugging escalation is
  one application.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
