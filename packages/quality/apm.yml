name: quality
version: 0.1.0
description: 'Bundle: Cross-language quality bundle for reviews, verification, language checks, and Hobson test/review workflows. Contains: skills code-review, go-quality, python-quality, rust-quality, typescript-quality, verify; agents pr-reviewer; steering; packages comprehensive-review, performance-testing-review, unit-testing, tdd-workflows.'
author: Sjors Robroek
license: MIT
type: hybrid
target: all
includes: auto

dependencies:
  apm:
    - wshobson/agents/plugins/comprehensive-review#main
    - wshobson/agents/plugins/performance-testing-review#main
    - wshobson/agents/plugins/unit-testing#main
    - wshobson/agents/plugins/tdd-workflows#main
