name: lsp-rust
version: 0.3.0
description: >-
  Rust LSP server: registers rust-analyzer so agents get hover, diagnostics,
  go-to-definition, and references on Rust sources. Installed transitively by
  the language-rust bundle; also installable on its own. Requires rust-analyzer
  on PATH (APM writes the config; it does not install the binary).
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: claude
includes: auto
category: languages
tags:
  - lsp
  - rust
dependencies:
  lsp:
    - name: rust-analyzer
      command: rust-analyzer
      extensionToLanguage:
        .rs: rust
      transport: stdio
