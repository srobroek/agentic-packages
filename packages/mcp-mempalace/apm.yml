name: mcp-mempalace
version: 0.1.0
description: >-
  MCP server package for MemPalace, a local-first cross-session memory layer for
  coding agents. Files verbatim conversation/decision history into a vector +
  temporal-graph store (ChromaDB, local embeddings, zero LLM calls) and recalls
  it via semantic + temporal search. Ships the mempalace-mcp stdio server, a
  SessionStart wake-up hook that injects relevant prior context, a mining script
  that ingests Claude Code / Codex session transcripts, and steering that scopes
  MemPalace (cross-session memory) against codebase-memory (current code
  structure). Complements code intelligence; it is not code navigation.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: mcp
tags:
  - mcp
  - memory
  - cross-session
dependencies:
  mcp:
    - name: mempalace
      registry: false
      transport: stdio
      command: mempalace-mcp
