name: beads
version: 0.7.1
description: >-
  Beads (bd) conventions for persistent task DAGs, atomic claims, native reply
  threads, decision records, ambiguity handling, actor identity, JSON envelopes,
  and Dolt sync. Steering separates local comments from cross-boundary decisions
  and harness wakes from persisted messages, and owns the carrier doctrine that
  dependent packages map onto. A build-formula skill covers formula authoring:
  conditional steps, gates, composition, and the assertions that prove a formula
  pours the DAG it declares. A guard denies mutating `gh issue` commands in
  Beads repositories. Opt-in sync hooks prefer native Dolt sync -- pull at session
  start, a detached push at session end once a `git push --dry-run` probe confirms
  it goes through, with a configurable pusher for hosts that need a wrapper -- and
  fall back to JSONL over ordinary git otherwise. A maintenance hook reports when
  Dolt history has grown enough to trim, and never trims it. Global `bd setup`
  wires session start; `bd init --skip-hooks` initializes repositories. Requires
  Beads >= 1.1.0 and activates only in repositories with `.beads/`.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
targets:
  - claude
  - codex
includes: auto
category: project-lifecycle
tags:
  - beads
  - issue-tracking
  - coordination
  - multi-agent
