name: beads
version: 0.4.1
description: >-
  Organization policy for Beads (bd): persistent task scope, atomic claims,
  field and metadata conventions, actor identity, lifecycle, gates, audit,
  formulas, molecules, wisps, swarms, merge slots, JSON envelopes, and
  authority-aware Dolt sync. Ships a PreToolUse guard denying mutating `gh
  issue` commands in beads repos and a concise dual-runtime subagent claim and
  handoff contract. The bd CLI owns `bd init`, `bd setup`, native Claude and
  Codex lifecycle hooks, generated instruction blocks and skills, and the Git
  hook bundle; this package does not render copies of those integrations.
  Requires gastownhall/beads >= 1.1.0; policy surfaces are inert outside a
  Beads workspace.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: project-lifecycle
tags:
  - beads
  - issue-tracking
  - coordination
  - multi-agent
