name: language-terraform
version: 3.1.0
description: >-
  Terraform and HCL toolkit: opinionated steering and Serena semantic code
  tools. No dedicated quality skill yet.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
includes: auto
category: languages
tags:
  - bundle
  - terraform
dependencies:
  apm:
    - srobroek/agentic-packages/packages/mcp-serena#>=1.4.1 <2.0.0
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: bash
      args:
        - '-lc'
        - >-
          launcher_rel="apm_modules/srobroek/agentic-packages/packages/mcp-serena/scripts/serena-pool.py";
          for launcher in "$PWD/$launcher_rel" "${APM_HOME:-}/$launcher_rel"
          "${HOME}/.apm/$launcher_rel" "$PWD/.apm/$launcher_rel"; do [ -r
          "$launcher" ] && exec python3 "$launcher"; done; echo
          serena-apm-launcher-not-found-run-apm-install >&2; exit 1
