name: project-lifecycle
version: 1.1.1
description: >-
  Day-to-day project lifecycle workflows: resume work after interruption
  (catchup), write handovers, run verification, and commit/push via local merge,
  PR, or quick commit. Bundles the matching skills and the PR reviewer agent.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: project-lifecycle
tags:
  - bundle
  - lifecycle
dependencies:
  apm:
    - srobroek/agentic-packages/packages/catchup#^0.1.3
    - srobroek/agentic-packages/packages/handover#^0.1.2
    - srobroek/agentic-packages/packages/commit-push-merge#^0.1.2
    - srobroek/agentic-packages/packages/commit-push-pr#^0.1.2
    - srobroek/agentic-packages/packages/quick-commit#^0.1.2
    - srobroek/agentic-packages/packages/verify#^0.1.2
    - srobroek/agentic-packages/packages/agent-pr-reviewer#^0.1.1
