name: project-lifecycle
version: 1.1.1
description: >-
  Day-to-day project lifecycle workflows: resume work after interruption
  (catchup), write handovers, run verification, and commit/push via local merge,
  PR, or quick commit. Bundles the matching skills and the PR reviewer agent.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: project-lifecycle
tags:
  - bundle
  - lifecycle
dependencies:
  apm:
    - srobroek/agentic-packages/packages/catchup#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/handover#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/commit-push-merge#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/commit-push-pr#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/quick-commit#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/verify#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/agent-pr-reviewer#>=1.1.0 <2.0.0
