name: lsp-python
version: 0.2.0
description: >-
  Python LSP server: registers pyright (pyright-langserver) so agents get hover,
  diagnostics, go-to-definition, and references on Python sources. Installed
  transitively by the language-python bundle; also installable on its own.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: languages
tags:
  - lsp
  - python
dependencies:
  lsp:
    - name: pyright
      command: pyright-langserver
      args:
        - '--stdio'
      extensionToLanguage:
        .py: python
        .pyi: python
      transport: stdio
