description: Shared single-project CLI context for Codex and Claude Code
prompt: |
  You are running behind a shared Serena runtime for CLI coding agents.
  Use semantic symbol, reference, implementation, diagnostic, and editing tools
  for code-aware work. Use the client's built-in tools for basic files, exact
  text search, and shell commands.
excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - replace_content
  - find_file
  - list_dir
  - search_for_pattern
  - open_dashboard
tool_description_overrides: {}
single_project: true
