name: mcp-serena
version: 1.4.1
description: >-
  MCP server package for Serena semantic code tools. The launcher shares one
  Serena backend across agents in the same checkout, isolates linked worktrees,
  and applies resource and capacity limits to worktree backends.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
category: mcp
tags:
  - mcp
  - semantic
dependencies:
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: bash
      args:
        - '-lc'
        - >-
          launcher_rel="apm_modules/srobroek/agentic-packages/packages/mcp-serena/scripts/serena-pool.py";
          for launcher in
          "$PWD/apm_modules/_local/mcp-serena/scripts/serena-pool.py"
          "$PWD/$launcher_rel" "${APM_HOME:-}/$launcher_rel"
          "${HOME}/.apm/$launcher_rel" "$PWD/.apm/$launcher_rel"; do [ -r
          "$launcher" ] && exec python3 "$launcher"; done; echo
          serena-apm-launcher-not-found-run-apm-install >&2; exit 1
