name: mcp-serena
version: 1.0.0
description: >-
  MCP server package for Serena semantic code tools. The launcher selects the
  Codex or Claude Code context from the parent harness and can be overridden
  with SERENA_MCP_CONTEXT.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: mcp
tags:
  - mcp
  - semantic
dependencies:
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: bash
      args:
        - '-lc'
        - >-
          ctx="${SERENA_MCP_CONTEXT:-}"; if [ -z "$ctx" ]; then parent="$(ps -o
          args= -p "$PPID" 2>/dev/null | tr "[:upper:]" "[:lower:]")"; case
          "$parent" in *claude*) ctx="claude-code" ;; *codex*) ctx="codex" ;; *)
          ctx="agent" ;; esac; fi; exec serena start-mcp-server --context "$ctx"
          --project-from-cwd
