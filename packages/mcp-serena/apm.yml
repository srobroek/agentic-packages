name: mcp-serena
version: 0.1.0
description: 'MCP package: Serena MCP server package for semantic code tools. The launcher selects the Codex or Claude Code context from the parent harness and can be overridden with SERENA_MCP_CONTEXT. Contains: MCP servers serena.'
author: Sjors Robroek
license: MIT
type: hybrid
target: all
includes: auto

dependencies:
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: bash
      args:
        - -lc
        - 'ctx="${SERENA_MCP_CONTEXT:-}"; if [ -z "$ctx" ]; then parent="$(ps -o args= -p "$PPID" 2>/dev/null | tr "[:upper:]" "[:lower:]")"; case "$parent" in *claude*) ctx="claude-code" ;; *codex*) ctx="codex" ;; *) ctx="agent" ;; esac; fi; exec serena start-mcp-server --context "$ctx" --project-from-cwd'
