name: hooks-quality
version: 1.3.0
description: >-
  Opt-in code-quality hooks: advisory linting/formatting feedback after edits
  and a quality check before commits. The before-commit gate is a FALLBACK — it
  defers when the pre-commit framework is installed (which already runs the same
  formatters), so it only fires in repos that have not adopted pre-commit.
  Cross-tool (Claude + Codex).
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: quality
tags:
  - hooks
  - quality
  - lint
