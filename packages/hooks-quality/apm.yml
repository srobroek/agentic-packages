name: hooks-quality
version: 2.0.2
description: >-
  Non-blocking quality advisory on edits. Accumulates edited files and changed
  lines across a session and suggests targeted checks (ruff, gofmt, cargo fmt,
  biome) once the change is large enough to warrant one, then holds a cooldown
  so it does not nag. Commit-time formatting is deliberately not covered: that
  is the pre-commit framework's stage, and this hook advises per language only
  where the framework does not already run a checker for it, which needs both an
  installed framework hook and a config naming that checker. Language selection
  reads .agents/hooks/quality-languages, then AGENTIC_QUALITY_LANGS, then marker
  files, so an unrecognised project is silent rather than guessed at. Never
  denies. Thresholds via AGENTIC_QUALITY_ADVISORY_LINES, _FILES,
  _COOLDOWN_SECONDS. Cross-tool (Claude + Codex).
author: Sjors Robroek
license: Apache-2.0
type: instructions
includes: auto
category: quality
tags:
  - hooks
  - quality
  - lint
