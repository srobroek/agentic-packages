name: hooks-quality
version: 1.3.1
description: >-
  Two non-blocking quality advisories sharing one language-detection module. On
  git commit, runs the project's formatters over the staged files and reports what
  to run (gofmt, ruff, cargo fmt, biome). On an edit, accumulates edited files and
  changed lines and suggests targeted checks once the change is large enough to be
  worth one, then holds a cooldown so it does not nag. Language selection reads
  .agents/hooks/quality-languages, then AGENTIC_QUALITY_LANGS, then marker files,
  so an unrecognised project is silent rather than guessed at. Defers entirely
  when the pre-commit framework already owns commit-time checks, which needs both
  a config and an installed framework hook. Neither hook ever denies: a
  formatting nit is trivially fixable and a blocked commit costs more.
  Thresholds via AGENTIC_QUALITY_ADVISORY_LINES, _FILES, _COOLDOWN_SECONDS.
  Cross-tool (Claude + Codex).
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: quality
tags:
  - hooks
  - quality
  - lint
