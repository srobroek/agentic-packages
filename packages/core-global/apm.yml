name: core-global
version: 0.7.0
description: >-
  Recommended global (user-scope) baseline bundle: the bootstrap workflow
  skills plus the reusable global skills and agents, each now an independently
  installable package and aggregated here. Install with
  'apm install core-global@srobroek-agentic --global'.
author: Sjors Robroek
license: Apache-2.0
type: bundle
target: all
includes: auto
category: core
tags:
  - bundle
  - global
  - bootstrap
dependencies:
  apm:
    - srobroek/agentic-packages/packages/project-setup#^0.1.0
    - srobroek/agentic-packages/packages/brownfield-project#^0.1.0
    - srobroek/agentic-packages/packages/project-hygiene#^0.1.0
    - srobroek/agentic-packages/packages/agent-management#^0.1.0
    - srobroek/agentic-packages/packages/find-tools#^0.1.0
    - srobroek/agentic-packages/packages/session-review#^0.1.0
    - srobroek/agentic-packages/packages/catchup#^0.1.3
    - srobroek/agentic-packages/packages/codebase-memory#^0.1.2
    - srobroek/agentic-packages/packages/debate#^0.1.2
    - srobroek/agentic-packages/packages/eli5#^0.1.2
    - srobroek/agentic-packages/packages/handover#^0.1.2
    - srobroek/agentic-packages/packages/write-a-skill#^0.1.2
    - srobroek/agentic-packages/packages/whats-new#^0.1.0
    - srobroek/agentic-packages/packages/chezmoi-editor#^0.2.1
    - srobroek/agentic-packages/packages/agent-coder#^0.1.1
    - srobroek/agentic-packages/packages/agent-pr-reviewer#^0.1.1
    - srobroek/agentic-packages/packages/agent-adversarial-challenger#^0.2.0
    - srobroek/agentic-packages/packages/agent-external-repo-worker#^0.1.2
    - mattpocock/skills/skills/productivity/grill-me#main
