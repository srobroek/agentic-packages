name: core-global
version: 0.7.0
description: >-
  Recommended global (user-scope) baseline: the bootstrap workflow skills
  shipped directly, plus the reusable global skills and agents pulled in by
  dependency. Install with 'apm install core-global@srobroek-agentic --global'.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
dependencies:
  apm:
    - srobroek/agentic-packages/packages/catchup#^0.1.3
    - srobroek/agentic-packages/packages/codebase-memory#^0.1.2
    - srobroek/agentic-packages/packages/debate#^0.1.2
    - srobroek/agentic-packages/packages/eli5#^0.1.2
    - srobroek/agentic-packages/packages/handover#^0.1.2
    - srobroek/agentic-packages/packages/write-a-skill#^0.1.2
    - srobroek/agentic-packages/packages/chezmoi-editor#^0.2.1
    - srobroek/agentic-packages/packages/agent-coder#^0.1.1
    - srobroek/agentic-packages/packages/agent-pr-reviewer#^0.1.1
    - srobroek/agentic-packages/packages/agent-adversarial-challenger#^0.2.0
    - srobroek/agentic-packages/packages/agent-external-repo-worker#^0.1.2
    - mattpocock/skills/skills/productivity/grill-me#main
