name: pr-shepherd
version: 6.0.1
description: >-
  Cross-session PR shepherd with beads as its durable state store. It validates
  exact check and head identity, honors persisted merge-slot order, merges with
  an atomic head guard, proves exact content on the final landing branch, and
  reconciles partial bounce writes through durable receipts. Stacked PRs remain
  open after their intermediate merge until their content reaches the landing
  branch. On a base with a GitHub merge queue it records the enqueue, proves the
  landing on a later pass, and bounces an ejection instead of reporting a merge.
  The skill and standalone agent optionally consume release-queue-watch records
  with crash-replay receipts. Requires bd, gh, git, and jq; inert in
  repositories without .beads/.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
targets:
  - claude
  - codex
includes:
  - .apm/agents
  - .apm/instructions
  - .apm/skills/pr-shepherd/SKILL.md
  - .apm/skills/pr-shepherd/references
  - .apm/skills/pr-shepherd/scripts/_test_bot_review_probe.py
  - .apm/skills/pr-shepherd/scripts/_test_landing_contract.sh
  - .apm/skills/pr-shepherd/scripts/_test_resolve_queue_event.py
  - .apm/skills/pr-shepherd/scripts/_test_sheepdog_real_db.sh
  - .apm/skills/pr-shepherd/scripts/_test_waiter_real_db.sh
  - .apm/skills/pr-shepherd/scripts/bot-review-probe.py
  - .apm/skills/pr-shepherd/scripts/landing-contract.py
  - .apm/skills/pr-shepherd/scripts/merge-probe.sh
  - .apm/skills/pr-shepherd/scripts/resolve-queue-event.py
  - .apm/skills/pr-shepherd/scripts/watch-queue.py
  - .apm/skills/pr-shepherd/scripts/test-fixtures
category: project-lifecycle
tags:
  - beads
  - merge-queue
  - pull-requests
  - integration
  - multi-agent
dependencies:
  apm:
    - srobroek/agentic-packages/packages/beads#>=2.0.1 <3.0.0
    - srobroek/agentic-packages/packages/release-queue-watch#>=0.6.3 <1.0.0
