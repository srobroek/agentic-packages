name: pr-shepherd
version: 0.8.0
description: >-
  Cross-session PR/merge shepherd with beads (bd) as the central state store.
  Merge work lives as beads labeled agent:integrator with gh:pr/gh:run gate
  beads owning async waits; any session (or a /loop or cron invocation) drains
  the queue: bd gate check, atomic claim, merge-tree conflict probe + gh PR
  state, then either a slot-guarded merge or a bounce-back fix bead routed to
  agent:coder that parks the merge bead until fixed. Ships the pr-shepherd
  skill, a standalone pr-shepherd agent, steering for the merge-bead lifecycle
  and bounce-back protocol. Requires the bd CLI (gastownhall/beads >= 1.1.0) and
  gh; optionally consumes release-queue-watch lifecycle and dispatch records
  with durable crash-replay receipts. All parts are inert in repos without
  .beads/.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: project-lifecycle
tags:
  - beads
  - merge-queue
  - pull-requests
  - integration
  - multi-agent
dependencies:
  apm:
    - srobroek/agentic-packages/packages/beads#>=0.4.2 <1.0.0
    - srobroek/agentic-packages/packages/release-queue-watch#>=0.5.0 <1.0.0
