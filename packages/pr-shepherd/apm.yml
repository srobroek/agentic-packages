name: pr-shepherd
version: 0.6.0
description: >-
  Cross-session PR shepherd backed by Beads. Discovers ready PRs through body
  backlinks, ignores drafts and release-please PRs, probes review, CI, and
  conflicts, serializes merges with the Beads merge slot, bounces failures
  into fix beads, and closes explicitly completing work beads only after
  verified landing and resolved blockers. Ships a dual-runtime skill,
  standalone agent, lifecycle steering, and merge probe. Requires
  gastownhall/beads >= 1.1.0 and gh; inert outside Beads repositories.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: project-lifecycle
tags:
  - beads
  - merge-queue
  - pull-requests
  - integration
  - multi-agent
dependencies:
  apm:
    - srobroek/agentic-packages/packages/beads#>=0.4.1 <1.0.0
