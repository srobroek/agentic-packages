name: mcp-context7
version: 1.2.2
description: >-
  MCP server package for Context7, providing current library and framework
  documentation lookups.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: mcp
tags:
  - mcp
  - docs
dependencies:
  mcp:
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args:
        - '-y'
        - '@upstash/context7-mcp'
