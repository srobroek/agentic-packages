name: mcp-gitnexus
version: 1.1.3
description: >-
  MCP server package for GitNexus code-intelligence: knowledge-graph queries
  over an indexed repository (execution flows, symbol context, impact/blast
  radius, call-path tracing). Ships the server config with
  SHARP_IGNORE_GLOBAL_LIBVIPS=1 so the npx install never source-builds sharp
  against a host libvips, plus steering on when graph queries beat text search
  and semantic tools.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: mcp
tags:
  - mcp
  - code-intelligence
  - knowledge-graph
dependencies:
  mcp:
    - name: gitnexus
      registry: false
      transport: stdio
      command: gitnexus
      args:
        - mcp
      env:
        SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
