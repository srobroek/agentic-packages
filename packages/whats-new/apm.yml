name: whats-new
version: 1.0.0
description: >-
  Research what changed in a tool, CLI, library, framework, package, or
  dependency — or a technology, cloud service, hosted API, platform, or model
  family (AWS Bedrock, Anthropic/Claude, OpenAI, GCP, Azure, …) — between what
  is in use and the latest: breaking changes, deprecations, new features, and
  fixes. Resolves versions, repos, changelogs, release notes, commit logs, and
  service announcement feeds/APIs via machine endpoints instead of reading
  rendered pages, then summarizes into a fixed template.
author: Sjors Robroek
license: Apache-2.0
type: skill
target: all
includes: auto
category: code-intelligence
tags:
  - skill
  - code-intelligence
  - dependencies
  - changelog
  - upgrade
  - research
  - services
  - release-notes
