name: review
version: 1.1.2
description: >-
  Code review and verification toolkit: the verify skill and the PR reviewer agent, and Hobson comprehensive-review,
  performance-testing-review, unit-testing, and tdd-workflows plugins.
  Language-specific quality checks live in the language-<lang> bundles.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: quality
tags:
  - bundle
  - review
dependencies:
  apm:
    - srobroek/agentic-packages/packages/verify#>=1.1.0 <2.0.0
    - srobroek/agentic-packages/packages/agent-pr-reviewer#>=1.1.0 <2.0.0
    - wshobson/agents/plugins/comprehensive-review#main
    - wshobson/agents/plugins/performance-testing-review#main
    - wshobson/agents/plugins/unit-testing#main
    - wshobson/agents/plugins/tdd-workflows#main
