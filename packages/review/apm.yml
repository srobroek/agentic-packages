name: review
version: 0.1.0
description: >-
  Code review and verification toolkit: the code-review and verify skills, the
  PR reviewer agent, and Hobson comprehensive-review,
  performance-testing-review, unit-testing, and tdd-workflows plugins.
  Language-specific quality checks live in the language-<lang> bundles.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
dependencies:
  apm:
    - srobroek/agentic-packages/packages/code-review#code-review-v0.1.1
    - srobroek/agentic-packages/packages/verify#verify-v0.1.1
    - >-
      srobroek/agentic-packages/packages/agent-pr-reviewer#agent-pr-reviewer-v0.1.1
    - wshobson/agents/plugins/comprehensive-review#main
    - wshobson/agents/plugins/performance-testing-review#main
    - wshobson/agents/plugins/unit-testing#main
    - wshobson/agents/plugins/tdd-workflows#main
