name: review
version: 0.1.0 # x-release-please-version
description: "Code review and verification toolkit: the code-review and verify skills, the PR reviewer agent, and Hobson comprehensive-review, performance-testing-review, unit-testing, and tdd-workflows plugins. Language-specific quality checks live in the language-<lang> bundles."
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: quality
tags:
  - bundle
  - quality
  - review
  - testing
  - verification

dependencies:
  apm:
    - code-review@srobroek-agentic
    - verify@srobroek-agentic
    - agent-pr-reviewer@srobroek-agentic
    - wshobson/agents/plugins/comprehensive-review#main
    - wshobson/agents/plugins/performance-testing-review#main
    - wshobson/agents/plugins/unit-testing#main
    - wshobson/agents/plugins/tdd-workflows#main
