name: dependency-quality
version: 4.0.1
description: >-
  Dependency hygiene bundle: nudges to investigate a dependency before adding it
  and audits the lockfile for known CVEs. Manifest-edit and latest-version
  guidance lives in steering-toolchain-defaults.
author: Sjors Robroek
license: Apache-2.0
type: bundle
target: all
includes: auto
category: project-lifecycle
tags:
  - bundle
  - dependencies
  - supply-chain
dependencies:
  apm:
    - >-
      srobroek/agentic-packages/packages/hooks-package-investigate#>=1.1.1
      <2.0.0
    - srobroek/agentic-packages/packages/dep-audit#>=2.1.0 <3.0.0
