name: dependency-quality
version: 0.1.0
description: >-
  Dependency hygiene bundle: warns on direct manifest edits, nudges to
  investigate a dependency before adding it, suggests installing the latest
  compatible version, audits the lockfile for known CVEs, and registers the
  package-version MCP server for version discovery. Aggregates independently
  installable components.
author: Sjors Robroek
license: Apache-2.0
type: bundle
target: all
includes: auto
category: project-lifecycle
tags:
  - bundle
  - dependencies
  - supply-chain
dependencies:
  apm:
    - srobroek/agentic-packages/packages/hooks-package-file-guard#^0.1.0
    - srobroek/agentic-packages/packages/hooks-package-investigate#^0.1.0
    - srobroek/agentic-packages/packages/hooks-pkg-version-warn#^0.1.0
    - srobroek/agentic-packages/packages/dep-audit#^0.1.0
    - srobroek/agentic-packages/packages/mcp-package-version#^0.2.0
