name: resume-session
version: 2.1.2
description: >-
  Resume a previous agent session in the current repository from its transcript,
  reading only the latest context incrementally instead of reloading the full
  history. Discovers prior Claude Code and Codex sessions, summarizes the
  leftoff state, confirms ambiguities, then continues the work.
