name: language-python
version: 0.1.0
description: Python quality bundle with language steering and Hobson specialists.
author: Sjors Robroek
license: MIT
type: hybrid
target: all
includes: auto

dependencies:
  apm:
    - wshobson/agents/plugins/python-development#main
  mcp:
    - name: lsp-python
      registry: false
      transport: stdio
      command: mcp-language-server
      args:
        - --workspace
        - .
        - --lsp
        - pyright-langserver
        - --lsp-arg
        - --stdio
