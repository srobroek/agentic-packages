name: hooks-squash-merge
version: 2.0.0
description: >-
  Opinionated git policy hook: advise an explicit merge strategy on gh pr merge.
  Emits a non-blocking advisory (allow + additionalContext) when no strategy
  flag is present; silent when --squash / -s / --merge / -m / --rebase / -r or
  --help is provided. Cross-tool (Claude + Codex).
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: project-lifecycle
tags:
  - hooks
  - git
  - policy
