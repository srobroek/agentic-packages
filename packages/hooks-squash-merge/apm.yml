name: hooks-squash-merge
version: 1.1.0
description: >-
  Opinionated git policy hook: require an explicit merge strategy on gh pr merge
  (--squash for feature PRs, --merge for release PRs). Blocks strategy-less PR
  merges. Cross-tool (Claude + Codex).
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: project-lifecycle
tags:
  - hooks
  - git
  - policy
