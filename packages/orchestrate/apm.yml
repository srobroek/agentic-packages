name: orchestrate
version: 0.2.0
description: >-
  Orchestrate a fleet of subagents across complex, parallel, or long-running
  work while controlling cost by routing each role to the cheapest capable
  model. Ships the orchestration playbook plus bundled agents (workflow-coder,
  workflow-reviewer, workflow-advisor, integration-gatekeeper, ledger-scribe), a
  SubagentStart comms-protocol hook, and deterministic scripts (task DAG, forensic
  ledger, agent discovery, conflict probe).
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
