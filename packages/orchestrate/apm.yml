name: orchestrate
version: 3.6.0
description: >-
  Coordinates parallel subagents through Beads-backed DAGs, claims, threaded
  replies, decisions, review, and merge state. Supports exact, specialist,
  generic-pull, writable-fallback, and read-only research dispatch. Bundles
  workflow-coder, workflow-pull-worker, workflow-worker, workflow-researcher,
  workflow-reviewer, workflow-advisor, integration-gatekeeper, and
  ledger-scribe. Includes deterministic scope, discovery, claim, message,
  decision, queue, and conflict scripts plus shared PR shepherd landing
  safeguards. Requires the bd CLI.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
dependencies:
  apm:
    - srobroek/agentic-packages/packages/release-queue-watch#>=0.5.0 <1.0.0
    - srobroek/agentic-packages/packages/pr-shepherd#>=0.9.0 <1.0.0
