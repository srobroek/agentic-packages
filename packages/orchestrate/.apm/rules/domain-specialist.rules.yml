# Contract rules for domain-specialist (spec 002-bead-as-brief).
# Single source of truth: the SubagentStop evaluator reads this, and the
# "Your bead contract" block in the agent definition is generated from it at
# compile time. Do not hand-edit the generated block.
agent: domain-specialist
tier: T1

completion:
  - check: branch
    require: metadata.branch
    when: git
  - check: push
    require: metadata.push
    when: git
  - check: output_ref
    require: metadata.output_ref
    when: artifact
  - check: handoff
    require: label ~ "^agent:"
  - check: reported
    require: comment.verb in [REPORTED]

# Lifecycle phases (reported/in_review/approved/...) are NOT bd statuses; they
# are derived from status + labels + gates + wisp closure. A specialist never
# CLOSES its own node (only the merge path / orchestrator does) — so `closed`
# is the forbidden built-in status here.
authority:
  deny_states: [closed]
  deny_metadata: [merge_sha, pr]

# Escape hatch: set bd status=blocked and leave a FAILED/BLOCKED comment. This
# is the always-permitted exit for a genuinely stuck node.
escape:
  state: blocked
  require: comment.verb in [FAILED, BLOCKED]

pause:
  - open-escalation-wisp-linked-to-node

bounce:
  max_attempts: 3
