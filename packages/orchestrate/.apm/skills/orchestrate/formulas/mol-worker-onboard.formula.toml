formula = "mol-worker-onboard"
description = "claim {{bead}} then create its linked Worktrunk checkout before touching it"
type = "workflow"

[vars.bead]
required = true
description = "the bead this worker claims"

[vars.role]
required = true
description = "the role label used by a queue worker"

[vars.needs_worktree]
default = "true"
description = "false for read-only or artifact-only work that writes no repo files"

[[steps]]
id = "claim-bead"
title = "claim {{bead}} from the {{role}} queue"
type = "task"
priority = 0
labels = ["onboard", "phase:start"]
description = """
Run in the parent checkout with isolation off:

BEADS_ACTOR="$ACTOR" BD_ACTOR="$ACTOR" bd update {{bead}} --claim

A worker claims before creating a worktree. A queue worker atomically claims one
compatible ready bead and accepts the returned bead; an empty result writes
NO_WORK and changes no node. Do not pre-assign, bind a runtime, or use a
parent-prepared checkout.
"""

[[steps]]
id = "create-linked-worktree"
title = "create the linked checkout for {{bead}}"
type = "task"
needs = ["claim-bead"]
condition = "{{needs_worktree}}"
labels = ["onboard", "phase:start"]
description = """
After the claim succeeds, run:

wt switch -y --create --no-cd --base <base> --format json omp/agent/{{bead}}

Read the JSON result, record its returned absolute path and branch on the claimed
bead, and continue from that path using absolute file paths. Run
`wt step copy-ignored --require-include` in the new worktree when the repository
needs copied gitignored dependencies.
"""

[[steps]]
id = "confirm-scope"
title = "read the scope and acceptance criteria on {{bead}}"
type = "task"
needs = ["claim-bead", "create-linked-worktree"]
labels = ["onboard", "phase:start"]
description = """
Re-read the claimed bead, its BRIEF, comments, links, and scope metadata before
the first edit. Work outside the stamped scope becomes a discovered bead or an
escalation, not an expansion of this claim.
"""

[[steps]]
id = "begin-work"
title = "begin work on {{bead}}"
type = "task"
needs = ["confirm-scope"]
labels = ["onboard", "phase:start"]
description = """
All preconditions hold: bead claimed, linked worktree created and recorded, and
scope understood. Only now edit files from the recorded absolute path.
"""
