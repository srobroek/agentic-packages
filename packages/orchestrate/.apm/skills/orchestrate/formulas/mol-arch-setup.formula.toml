formula = "mol-arch-setup"
description = "claim {{owner_bead}} then create its linked Worktrunk checkout"
type = "workflow"

[vars.repo]
required = true
description = "parent repository checkout where the task agent starts"

[vars.branch]
required = true
description = "base ref or branch carrying the target work"

[vars.owner_bead]
required = true
description = "bead the task agent claims before creating its checkout"

[vars.copies_ignored]
default = "true"
description = "whether the new worktree needs copied gitignored inputs"

[[steps]]
id = "claim-owner"
title = "claim {{owner_bead}} in the parent checkout"
type = "task"
priority = 0
labels = ["arch-setup", "phase:start"]
description = """
Run in {{repo}} with isolation off:

BEADS_ACTOR="$ACTOR" BD_ACTOR="$ACTOR" bd update {{owner_bead}} --claim

The claim is the ownership lock. Do not pre-assign the actor or pre-create a
checkout for this bead.
"""

[[steps]]
id = "create-linked-worktree"
title = "create the linked worktree for {{owner_bead}}"
type = "task"
needs = ["claim-owner"]
labels = ["arch-setup", "phase:provision"]
description = """
After claiming, run:

wt switch -y --create --no-cd --base {{branch}} --format json omp/agent/{{owner_bead}}

Read the JSON result and record the returned branch and absolute path on
{{owner_bead}}. Continue only from that linked checkout using absolute paths.
"""

[[steps]]
id = "copy-ignored"
title = "copy gitignored build inputs into the linked worktree"
type = "task"
needs = ["create-linked-worktree"]
condition = "{{copies_ignored}}"
labels = ["arch-setup", "phase:provision"]
description = """
Run `wt step copy-ignored --require-include <worktree>` from the parent checkout
when the repository requires copied dependencies. Skip only when no untracked
inputs are needed.
"""

[[steps]]
id = "verify-linked-worktree"
title = "verify the linked worktree for {{owner_bead}}"
type = "task"
needs = ["create-linked-worktree", "copy-ignored"]
labels = ["arch-setup", "phase:verify"]
description = """
Read back the bead metadata and Worktrunk JSON. Confirm the branch and absolute
worktree path match the returned checkout, and confirm the tree is clean and
writable before editing.
"""
