name: infrastructure
version: 0.1.0
description: >-
  Infrastructure and operations toolkit: infrastructure steering plus Hobson
  cloud, Kubernetes, CI/CD, deployment, deployment-validation, and observability
  plugins.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
dependencies:
  apm:
    - steering-infrastructure@srobroek-agentic
    - wshobson/agents/plugins/cloud-infrastructure#main
    - wshobson/agents/plugins/kubernetes-operations#main
    - wshobson/agents/plugins/cicd-automation#main
    - wshobson/agents/plugins/deployment-strategies#main
    - wshobson/agents/plugins/deployment-validation#main
    - wshobson/agents/plugins/observability-monitoring#main
