schema_version = "1.0"

[meta]
repository = "github.com/srobroek/agentic-packages"
author = "Sjors Robroek"

[module]
id = "lang-python"
name = "Python language overlay"
version = "1.0.0"
description = "Add Python tooling (uv, ruff, pytest) to a scaffolded project. Appends Python .gitignore entries and ruff pre-commit hooks."
default_enabled = false
reconcile = true

[order]
after = ["gitignore-generate", "precommit-setup"]

[[inputs]]
key = "python_version"
type = "string"
prompt = "Python version to target?"
default = "3.13"
required = false

[[inputs]]
key = "framework"
type = "string"
prompt = "Framework (optional, e.g. fastapi, django, flask — leave empty for none)?"
default = ""
required = false

[[steps]]
id = "resolve"
kind = "agent"
steering = "steering/resolve.md"

[[steps]]
id = "pins"
kind = "gate"
message = "Python stack decision:\n{decision}\nWrite pyproject.toml + dev tooling with these EXACT pins?"

[[steps]]
id = "write"
kind = "python"
