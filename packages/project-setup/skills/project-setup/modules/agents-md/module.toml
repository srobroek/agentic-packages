schema_version = "1.0"

[meta]
repository = "github.com/srobroek/agentic-packages"
author = "Sjors Robroek"

[module]
id = "agents-md"
name = "AGENTS.md skeleton"
version = "1.0.0"
description = "Write a skeleton AGENTS.md. Single and monorepo layouts use separate verbatim templates with PROJECT_NAME and ORG substituted."
default_enabled = true
reconcile = true

[order]
after = ["dirs-scaffold"]
requires = ["core-identity"]

[[inputs]]
key = "layout"
type = "choice"
prompt = "Project layout"
choices = ["single", "monorepo"]
default = "single"
required = false

[[inputs]]
key = "project_name"
type = "string"
prompt = "Project name"
required = true

[[inputs]]
key = "org"
type = "string"
prompt = "GitHub owner / organisation"
required = false

[[steps]]
id = "write"
kind = "python"
