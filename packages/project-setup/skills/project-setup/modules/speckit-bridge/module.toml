schema_version = "1.0"

[meta]
repository = "github.com/srobroek/agentic-packages"
author = "Sjors Robroek"

[module]
id = "speckit-bridge"
name = "Speckit bridge"
version = "1.0.0"
description = "Install and initialise speckit when spec_mode is lightweight or full."
default_enabled = false
reconcile = false

[order]
after = ["apm-install"]

[[inputs]]
key = "spec_mode"
type = "choice"
prompt = "Spec / speckit mode"
choices = ["none", "lightweight", "full"]
default = "none"
required = false

[[steps]]
id = "setup"
kind = "python"
