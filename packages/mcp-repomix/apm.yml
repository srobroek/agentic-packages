name: mcp-repomix
version: 1.2.1
description: >-
  MCP server package for Repomix, providing bulk repository snapshots for
  analysis and review. The PostToolUse snapshot-refresh hook requires python3
  on PATH.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: mcp
tags:
  - mcp
  - repomix
dependencies:
  mcp:
    - name: repomix
      registry: false
      transport: stdio
      command: npx
      args:
        - '-y'
        - repomix
        - '--mcp'
