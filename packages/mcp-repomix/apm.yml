name: mcp-repomix
version: 0.1.0 # x-release-please-version
description: "MCP server package for Repomix, providing bulk repository snapshots for analysis and review."
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: mcp
tags:
  - bundle
  - mcp
  - code-intelligence

dependencies:
  mcp:
    - name: repomix
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - repomix
        - --mcp
