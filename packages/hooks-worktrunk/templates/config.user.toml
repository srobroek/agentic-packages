# User config: ~/.config/worktrunk/config.toml
worktree-path = "~/tmp/worktrees/{{ repo }}/{{ branch | sanitize }}"

[[pre-start]]
# Required setup is blocking so the first command sees trusted mise config.
mise-trust = "mise trust --yes"

[[pre-start]]
# Worktrunk renders both absolute paths. Persist the repository target in the
# linked checkout because hook exports do not reach later build shells.
cargo-target = """
if [ -f "{{ worktree_path }}/Cargo.toml" ]; then
  cargo_config="{{ worktree_path }}/.cargo/config.toml"
  marker="# Generated by the Worktrunk user pre-start hook."
  if [ -e "$cargo_config" ] && ! grep -Fqx "$marker" "$cargo_config"; then
    echo "worktrunk: refusing to overwrite existing $cargo_config; configure build.target-dir in the project" >&2
    exit 1
  fi

  common_dir="$(git -C "{{ worktree_path }}" rev-parse --path-format=absolute --git-common-dir)"
  exclude_file="$common_dir/info/exclude"
  mkdir -p "$(dirname "$exclude_file")" "$(dirname "$cargo_config")"
  grep -Fqx '/.cargo/config.toml' "$exclude_file" 2>/dev/null ||
    printf '\\n# Worktrunk repository-scoped Cargo target\\n/.cargo/config.toml\\n' >> "$exclude_file"
  printf '%s\\n[build]\\ntarget-dir = "%s"\\n' "$marker" "{{ primary_worktree_path }}/target" > "$cargo_config"
fi
"""

[post-start]
# Projects opt in through .worktreeinclude.
copy-ignored = "wt step copy-ignored --require-include"

[step.copy-ignored]
exclude = [".cargo/config.toml", ".venv/", "venv/", "target/"]

[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --safe-mode --setting-sources='user' --system-prompt=''"

[commit]
stage = "all"

[merge]
squash = true
commit = true
rebase = true
remove = true
verify = true
ff = true

[list]
full = false
summary = false

[aliases]
co = "wt switch {{ args }}"
new = "wt switch --create {{ args }}"
pr = "wt switch pr:{{ args }}"
prs = "wt switch --prs"
commit = "wt step commit {{ args }}"
prune-preview = "wt step prune --dry-run {{ args }}"
prune = "wt step prune {{ args }}"
logs = "wt config state logs get {{ args }}"
trust = "mise trust --yes"
