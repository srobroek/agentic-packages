name: hooks-subagent-fork
version: 0.1.0
description: >-
  PreToolUse:Agent deny gate rejecting Codex spawn_agent calls whose
  fork_turns is "all", omitted (Codex defaults omitted to a full-history
  fork), or above the numeric maximum (default 3, SUBAGENT_FORK_GUARD_MAX
  overrides). Denials carry the corrected call format.
  A SubagentStart hook injects the fork_turns="none" discipline into spawning
  subagents, and an always-on instruction carries the same rule in the main
  session. Claude spawn payloads carry none of the Codex spawn fields and
  pass through untouched. The hook fails open on malformed input.
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: project-lifecycle
