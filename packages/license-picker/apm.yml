name: license-picker
version: 1.1.0
description: >-
  Interactive "choose your own adventure" license picker for open-source
  projects. Interviews the user about their repo type, threat model, ecosystem,
  and contribution goals, then recommends an OSI-approved license with full
  rationale. Validates against real license text and SPDX identifiers.
author: Sjors Robroek
license: Apache-2.0
type: skill
target: all
includes: auto
category: project-lifecycle
tags:
  - skill
  - licensing
  - open-source
  - interactive
  - setup
