name: mcp-playwright
version: 1.2.1
description: >-
  MCP server package for Playwright, providing browser automation and in-browser
  UI verification.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: mcp
tags:
  - mcp
  - browser
dependencies:
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - '-y'
        - '@playwright/mcp@latest'
