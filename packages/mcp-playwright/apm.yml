name: mcp-playwright
version: 0.1.0 # x-release-please-version
description: "MCP server package for Playwright, providing browser automation and in-browser UI verification."
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all

dependencies:
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - '@playwright/mcp@latest'
