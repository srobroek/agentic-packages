name: mcp-playwright
version: 1.3.1
description: >-
  MCP server package for Playwright, providing stateful browser automation and
  in-browser UI verification. The server inlines the accessibility tree on every
  action, so prefer `playwright-cli` (see the `playwright` skill) for scripted
  flows and keep this for loops that need the model reasoning over page
  structure turn by turn. Do not pass `--snapshot-mode none`: element refs come
  from snapshots, so it removes the ability to interact.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: mcp
tags:
  - mcp
  - browser
dependencies:
  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: npx
      args:
        - '-y'
        - '@playwright/mcp@latest'
