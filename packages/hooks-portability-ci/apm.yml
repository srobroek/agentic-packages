name: hooks-portability-ci
version: 0.5.0
description: >-
  CI gate that runs shipped hook scripts through the real portability failure
  modes the audits found: bash 3.2 parse errors (;;& fallthrough, mapfile),
  GNU-only sed/grep constructs (\b word boundaries, lazy quantifiers), and
  string-form tool_input payloads that crash jq. Reports a summary and exits
  non-zero on any failure. Invoked on demand or wired into CI.
author: Sjors Robroek
license: Apache-2.0
type: skill
target: all
includes: auto
category: project-lifecycle
tags:
  - ci
  - hooks
  - portability
  - testing
