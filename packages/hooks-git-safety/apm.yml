name: hooks-git-safety
version: 1.2.0
description: >-
  Git safety guards: hard-block `git reset --hard` only when the tracked tree is
  dirty (work would be lost) and `git push --force`, and soft-guard other
  destructive git operations — confirm (ask) on checkout --/restore/clean
  -f/branch/stash/tag deletion/worktree remove. Cross-tool (Claude + Codex).
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: project-lifecycle
tags:
  - hooks
  - git
  - safety
