name: mcp-tauri
version: 0.3.0
description: >-
  MCP server package for Tauri, enabling AI assistants to drive, test, and debug
  Tauri v2 apps — screenshots, DOM queries, click/type/scroll automation,
  navigation, JS execution, storage/window control, and plugin setup. Backed by
  the P3GLEG tauri-plugin-mcp socket server over TCP 127.0.0.1:9999.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: mcp
tags:
  - mcp
  - tauri
  - testing
dependencies:
  mcp:
    - name: tauri
      registry: false
      transport: stdio
      command: npx
      args:
        - '-y'
        - tauri-plugin-mcp-server
      env:
        TAURI_MCP_CONNECTION_TYPE: tcp
        TAURI_MCP_TCP_HOST: 127.0.0.1
        TAURI_MCP_TCP_PORT: '9999'
