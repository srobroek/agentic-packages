name: hooks-no-ff
version: 1.2.0
description: >-
  Opinionated git policy hook: advise --no-ff on real git merge invocations so
  feature-branch history is preserved. Emits a non-blocking advisory
  (allow + additionalContext) when --no-ff is absent; silent on --abort /
  --continue / --quit / --ff-only / --squash. Cross-tool (Claude + Codex).
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: project-lifecycle
tags:
  - hooks
  - git
  - policy
