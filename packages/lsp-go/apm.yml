name: lsp-go
version: 0.4.0
description: >-
  Go LSP server: registers gopls so agents get hover, diagnostics,
  go-to-definition, and references on Go sources. Installed transitively by the
  language-go bundle; also installable on its own. Requires gopls on PATH (APM
  writes the config; it does not install the binary).
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: claude
includes: auto
category: languages
tags:
  - lsp
  - go
dependencies:
  lsp:
    - name: gopls
      command: gopls
      extensionToLanguage:
        .go: go
      transport: stdio
