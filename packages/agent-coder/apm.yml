name: agent-coder
version: 4.0.0
description: >-
  Implementation subagents for bounded code changes, tests, and refactors within
  a defined scope. Ships `coder` (edits the caller's tree directly; the parent
  commits) and `parallel-coder` (runs in an isolated worktree, self-commits, and
  hands back a reviewable branch — for parallel or staged work).
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: engineering
