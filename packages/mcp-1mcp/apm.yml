name: mcp-1mcp
version: 1.0.5
description: >-
  MCP client package for the shared 1MCP runtime. Starts the machine-managed
  background runtime when needed and connects clients through its proxy.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: mcp
tags:
  - mcp
  - aggregation
dependencies:
  mcp:
    - name: 1mcp
      registry: false
      transport: stdio
      command: bash
      args:
        - '-lc'
        - >-
          launcher_rel="apm_modules/srobroek/agentic-packages/packages/mcp-1mcp/scripts/launcher.sh";
          for apm_root in "${APM_HOME:-}" "${HOME}/.apm" "$PWD/.apm"; do [ -n
          "$apm_root" ] || continue; launcher="$apm_root/$launcher_rel"; [ -r
          "$launcher" ] && exec bash "$launcher"; done; echo
          1mcp-apm-launcher-not-found-run-apm-install >&2; exit 1
