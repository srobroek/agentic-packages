name: mcp-1mcp
version: 0.1.0
description: >-
  MCP client package for the shared 1MCP runtime. Starts the machine-managed
  background runtime when needed and connects clients through its proxy.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
category: mcp
tags:
  - mcp
  - aggregation
dependencies:
  mcp:
    - name: 1mcp
      registry: false
      transport: stdio
      command: bash
      args:
        - '-lc'
        - >-
          command -v 1mcp >/dev/null 2>&1 || { echo
          1mcp-not-installed-install-agent-0.34.1-or-later >&2; exit 127; }; 1mcp serve --background
          >/dev/null || { 1mcp serve --status >&2; exit 1; }; exec 1mcp proxy
