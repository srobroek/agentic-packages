name: lsp-terraform
version: 0.1.0
description: >-
  Terraform LSP server: registers terraform-ls so agents get hover,
  diagnostics, go-to-definition, and references on Terraform sources. Installed
  transitively by the language-terraform bundle; also installable on its own.
  Requires terraform-ls on PATH (APM writes the config; it does not install the
  binary).
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: languages
tags:
  - lsp
  - terraform
dependencies:
  lsp:
    - name: terraform-ls
      command: terraform-ls
      args: ["serve"]
      extensionToLanguage:
        ".tf": terraform
        ".tfvars": terraform-vars
      transport: stdio
