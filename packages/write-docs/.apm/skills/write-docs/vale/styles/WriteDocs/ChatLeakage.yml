# E5 in the retired slop-lint.py. Errors in EVERY genre, change included: unlike
# the lexicon rules this is never a style judgement -- a cutoff disclaimer or a
# tool artifact in a shipped document is always a defect.
#
# No published Vale style covers this. Checked tbhb/vale-ai-tells v1.25.0:
# SycophancyMarkers is praise only, SelfReference is cross-references only.
extends: existence
message: "chat-session leakage: %s — delete it, then audit the surrounding prose"
level: error
link: https://github.com/srobroek/agentic-packages/blob/main/packages/write-docs/.apm/skills/write-docs/references/ai-tells.md
ignorecase: true
raw:
  - '(\bas an AI\b|\bas a large language model\b|\bI''?m an AI\b|'
  - '\bas of my (last )?(update|knowledge cut[- ]?off)\b|'
  - '\bmy (training data|knowledge) (only )?(goes up to|extends to|cut[- ]?off)\b|'
  - '\bI (cannot|can''?t|am unable to) (browse|access the internet|provide)\b|'
  - '\bI (apologi[sz]e|hope this helps)\b|\bfeel free to ask\b|'
  - '\bthis section would (contain|describe|explain)\b|'
  - '\b(insert|your) [a-z ]{3,20} here\b|\bTODO: (add|write|fill)\b|'
  - 'oaicite|contentReference|\[cite:\s*\d+\]|grok_card|'
  - '\x{3010}\d+\x{2020}[^\x{3011}]*\x{3011})'
