# E4 in the retired slop-lint.py. Off for the change genre, where the delta is
# the subject.
extends: existence
message: "history narration: %s — deltas belong in change comms, not a doc body"
level: error
link: https://github.com/srobroek/agentic-packages/blob/main/packages/write-docs/.apm/skills/write-docs/references/change-comms.md
ignorecase: true
raw:
  - '\b(previously|formerly|used to (be|do|have)|has been (refactored|migrated|renamed|rewritten)|'
  - 'was (refactored|migrated|renamed|rewritten|extracted)|renamed from|moved (over )?from|'
  - 'we (dropped|removed|changed|switched|migrated)|no longer\b|instead of the old)\b'
