# W1 in the retired slop-lint.py. `%d`, not `%s`: occurrence populates an int and
# `%s` renders it as `%!s(int=N)`. Vale's paragraph scope replaces the old
# line-prefix heuristic, which miscounted wrapped list-item continuations and
# markdown syntax as prose words.
#
# KNOWN FALSE POSITIVE, and the reason this stays a warning rather than an error:
# a run of MUST/NOT/DEFAULT rule lines with no blank line between them is one
# `<p>` to Vale, so a long rule block reads as a long prose block (measured: 33
# hits in a 150-file sample; 142 files use that format). `occurrence` cannot skip
# lines by prefix, and `scope` has no "line" granularity, so this is not
# expressible as a rule. Judge these by eye: a rule list is already the structure
# the message asks for.
extends: occurrence
message: "prose block of %d words > 80 — convert to a list or table (ignore if this is a MUST/NOT rule block)"
level: warning
link: https://github.com/srobroek/agentic-packages/blob/main/packages/write-docs/.apm/skills/write-docs/SKILL.md
scope: paragraph
max: 80
token: '\b(\w+)\b'
