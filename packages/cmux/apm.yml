name: cmux
version: 0.2.0
description: >-
  cmux terminal control bundle: vendored user-facing skills that teach agents to
  drive and configure the cmux macOS terminal via its socket CLI -- topology and
  routing (windows, workspaces, panes, surfaces), customization, settings,
  socket policy, Ghostty rendering config, keyboard shortcuts, diagnostics, and
  shared behavior. Contributor skills (architecture, backend, release, testing)
  are omitted. Third-party (manaflow-ai/cmux publishes no APM/marketplace
  manifest); referenced as raw GitHub skill paths, same pattern as the other
  external bundles.
author: Sjors Robroek
license: Apache-2.0
type: skill
target: all
includes: auto
category: developer-tools
tags:
  - bundle
  - cmux
  - terminal
dependencies:
  apm:
    - manaflow-ai/cmux/skills/cmux#main
    - manaflow-ai/cmux/skills/cmux-workspace#main
    - manaflow-ai/cmux/skills/cmux-customization#main
    - manaflow-ai/cmux/skills/cmux-settings#main
    - manaflow-ai/cmux/skills/cmux-diagnostics#main
    - manaflow-ai/cmux/skills/cmux-socket-policy#main
    - manaflow-ai/cmux/skills/cmux-ghostty#main
    - manaflow-ai/cmux/skills/cmux-keyboard-shortcuts#main
    - manaflow-ai/cmux/skills/cmux-shared-behavior#main
