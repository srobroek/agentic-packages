name: toolchain-cache-policy
version: 2.0.2
description: >-
  Shares bounded package-manager and compiler caches across worktrees without
  redirecting mutable dependencies or branch output into machine-global
  directories. SessionStart uses DEVELOPMENT_CACHE_HOME for sccache, Python, Go,
  Node, Deno, Gradle, NuGet, Trivy, Restic, and lint cache paths, then evicts
  only regenerable compiler caches under disk pressure. Cargo targets remain
  repository-scoped through Worktrunk. Fails open; Claude and Codex SessionStart
  parity.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: project-lifecycle
tags:
  - hooks
  - cache
  - disk
  - worktree
  - toolchain
  - scaling
