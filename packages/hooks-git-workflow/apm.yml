name: hooks-git-workflow
version: 1.3.0
description: >-
  Opt-in git workflow hooks: BLOCK a git push when unit tests are stale or
  failing (the hook does not run tests — it reads the edit/test state the
  tracker records and tells the agent to run them; warns-and-allows when no test
  command is detectable, bypass with SKIP_TEST_GATE=1), track edit-vs-test state
  from real test runners only, and warn about uncommitted AND unpushed work at
  session end (continuous commit/push cadence). Cross-tool (Claude + Codex).
author: Sjors Robroek
license: Apache-2.0
type: instructions
target: all
includes: auto
category: project-lifecycle
tags:
  - hooks
  - git
  - commit
