name: mcp-serena-claude-code
version: 0.1.0
description: 'MCP package: Serena MCP server package for Claude Code semantic code tools. Contains: MCP servers serena.'
author: Sjors Robroek
license: MIT
type: hybrid
target: claude
includes: auto

dependencies:
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: serena
      args:
        - start-mcp-server
        - --context
        - claude-code
        - --project-from-cwd
