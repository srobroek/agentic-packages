name: lsp-shell
version: 0.2.0
description: >-
  Shell LSP server: registers bash-language-server so agents get hover,
  diagnostics, go-to-definition, and references on Bash/POSIX shell sources.
  Installed transitively by the language-shell bundle; also installable on its
  own. Requires bash-language-server on PATH (APM writes the config; it does not
  install the binary).
author: Sjors Robroek
license: Apache-2.0
type: hybrid
target: all
includes: auto
category: languages
tags:
  - lsp
  - shell
dependencies:
  lsp:
    - name: bash-language-server
      command: bash-language-server
      args:
        - start
      extensionToLanguage:
        .sh: shellscript
        .bash: shellscript
      transport: stdio
