name: dep-audit
version: 2.1.1
description: >-
  Scan the project's lockfiles and manifests for known-vulnerable dependencies
  using the ecosystem's native scanners (npm/pnpm audit, pip-audit, cargo audit,
  govulncheck, osv-scanner) and report CVEs grouped by severity. Never
  auto-fixes.
author: Sjors Robroek
license: Apache-2.0
type: skill
target: all
includes: auto
category: security
tags:
  - skill
  - security
  - dependencies
  - audit
  - cve
